<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retro preview</title>
<!-- retro preview: the video with every beat running live on top, sound effects mixed in the browser
     with the export's synth, and controls that write straight to retro.json (via lib/studio.mjs).
     Layout: header (global toggles) · stage (click an animation to select it, drag to move) ·
     timeline (resizable; ruler, beats with drag handles for trim/stretch, sound lanes where sounds
     drag left/right and their right edge trims them) · side panel (beat list + inspector) · the sound
     editor pops out to the left of the side panel.
     Sound edits ("sounds" in retro.json) are applied by the beat's own R.sfxApply and the shared synth,
     so what you hear here is what the render mixes. -->
<link rel="stylesheet" href="preview.css">
</head>
<body>
<header>
  <a class="pill home" href="/" title="All projects">← Projects</a>
  <h1 id="projName">Retro preview</h1>
  <button class="pill" id="pSfx" title="Hear the sound effects while you play"><span class="dot"></span>Sound effects</button>
  <button class="pill" id="pZone" title="Show the face no-go zone (red dashes)"><span class="dot"></span>Face zone</button>
  <button class="pill" id="pSnapV" title="While dragging, pull an animation's centre onto the vertical centre line (hold ⌥ to drag past)"><span class="dot"></span>Snap centre</button>
  <button class="pill" id="pSnapH" title="Same for the horizontal middle line"><span class="dot"></span>Snap middle</button>
  <span id="status"></span>
  <button class="pill" id="pUndo" title="Undo (⌘Z)" disabled>↶ Undo</button>
  <button class="pill" id="pRedo" title="Redo (⇧⌘Z)" disabled>↷ Redo</button>
  <button class="pill" id="pReset" title="Put things back the way they were written (asks first, and you can undo)">↺ Reset…</button>
  <button class="pill" id="pLint" title="Check placement, clipping and timing (the same check as retro lint)"><span class="dot"></span>Lint</button>
  <button class="pill pri" id="pRender" title="Render a draft or the final video">Render…</button>
</header>

<div id="stageWrap">
  <div id="stage">
    <video id="v" preload="auto" playsinline></video><canvas id="bg"></canvas>
    <div id="zone"></div><div id="guideV" class="guide"></div><div id="guideH" class="guide"></div>
    <div id="selBox"><span></span></div>
    <div id="grab"></div>
  </div>
</div>

<footer>
  <div id="grip" title="Drag to resize the timeline"></div>
  <div class="transport">
    <button id="play" title="Play / pause (Space)">▶</button>
    <span id="tc" class="num"><b>0.00</b> / 0.00</span>
    <button class="btn sm pri" id="addSnd" title="Add a sound at the playhead (it belongs to the beat playing there)">+ Sound</button>
    <span class="seg" title="What dragging a beat's edges does (hold ⌥ while dragging for the other one)">
      <button id="toolTrim">✂ Trim</button><button id="toolStretch">↔ Stretch</button>
    </span>
    <span class="grp">
      <button class="btn sm" id="zOut" title="Zoom out">−</button>
      <button class="btn sm" id="zFit" title="Fit the whole video">Fit</button>
      <button class="btn sm" id="zBeat" title="Zoom to the selected beat">Beat</button>
      <button class="btn sm" id="zIn" title="Zoom in (or pinch / ⌘-scroll)">+</button>
    </span>
    <span class="keys"><kbd>Space</kbd> play · drag sounds to move them, their right edge to shorten · drag a box on the lanes to select several · drag beat edges to trim/stretch (<kbd>⌥</kbd> swaps) · <kbd>[</kbd><kbd>]</kbd> trim to playhead · <kbd>Esc</kbd></span>
  </div>
  <div id="tl">
    <div id="tlLabels"></div>
    <div id="tlScroll"><div id="tlInner"></div></div>
  </div>
</footer>

<aside>
  <div id="list"></div>
  <div id="insp"></div>
</aside>
<div id="sndPop"></div>
<div id="resetMenu"></div>
<div id="lintPanel" class="spop"></div>
<div id="renderMenu" class="spop"></div>
<div id="toast"></div>


<script type="module" src="main.js"></script>
</body>
</html>
