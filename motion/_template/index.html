<!doctype html>
<!--
  Cutroom animation (a HyperFrames composition). Start here.

  What makes it render (skills/cutroom/SKILL.md has the rest, animations.md the recipes):
  · Transparent background: it plays over the video.
  · Cutroom sets the size for each render. Lay out in %, vw/vh, or var(--cr-w) / var(--cr-h).
  · One paused GSAP timeline on window.__timelines["root"]; its length is the animation's length.
    Deterministic: no Date.now(), no Math.random() (use a seeded one), no CSS animations.
  · Set cutroom:kind to text, transition or card. Transitions also set cutroom:cut: the point (0..1)
    where the clip fully hides the picture, which is where Cutroom puts the cut.
  Style is open. Start from the user's brand: var(--cr-plate) (band/plate behind text), var(--cr-text),
  var(--cr-accent), var(--cr-display) for statements, var(--cr-body) for labels. Inputs that change
  between uses are variables (data-composition-variables); read them with window.__hyperframes.getVariables().
-->
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"Text","default":"Your line here"}]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <meta name="cutroom:kind" content="text" />
  <meta name="description" content="Describe what this animation does and when to use it." />
  <title>Untitled animation</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { /* brand defaults; Cutroom injects the user's */
            --cr-plate: #141310; --cr-text: #f3f0e9; --cr-accent: #3e8b82; --cr-display: Fraunces, Georgia, serif; --cr-body: Inter, system-ui, sans-serif;
            --cr-w: 1080px; --cr-h: 1920px; }
    html, body { margin: 0; overflow: hidden; background: transparent; }
    #root { position: relative; width: var(--cr-w); height: var(--cr-h); overflow: hidden; }
    .clip { position: absolute; inset: 0; }
    .line { position: absolute; left: 8%; right: 8%; top: 30%; font: 400 calc(min(var(--cr-w), var(--cr-h)) * 0.1)/1.05 var(--cr-display); color: var(--cr-text); letter-spacing: -0.015em; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="line-clip" data-start="0" data-duration="2.5">
      <div class="line" id="line"></div>
    </div>
  </div>
  <script>
    const { text } = window.__hyperframes.getVariables();
    document.getElementById("line").textContent = text;
    const tl = gsap.timeline({ paused: true });
    tl.from("#line", { y: 40, opacity: 0, duration: 0.5, ease: "power2.out" }, 0);
    tl.to("#line", { opacity: 0, duration: 0.35, ease: "power2.in" }, 2.15);
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</body>
</html>
