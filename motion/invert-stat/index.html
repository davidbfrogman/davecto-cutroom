<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"value","type":"string","label":"Number","default":"53%"},
  {"id":"label","type":"string","label":"Label","default":"reduction in code"},
  {"id":"hold","type":"string","label":"Holds (s)","default":"2.4"},
  {"id":"position","type":"string","label":"Position (top, center, lower)","default":"center"}
]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <meta name="cutroom:kind" content="text" />
  <meta name="cutroom:blend" content="invert" />
  <meta name="description" content="A huge number with a small label, drawn as the negative of the video behind it (no plate). The digits rise in one by one. For one stat that should stop the scroll." />
  <title>Invert stat</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    /* Drawn in white: Cutroom uses only the alpha, as a mask that inverts the picture below. */
    :root { --cr-plate: #141310; --cr-text: #f3f0e9; --cr-accent: #3e8b82; --cr-display: Fraunces, Georgia, serif; --cr-body: Inter, system-ui, sans-serif;
            --mask: #fff; --cr-w: 1080px; --cr-h: 1920px; --u: calc(min(var(--cr-w), var(--cr-h)) / 100); }
    html, body { margin: 0; overflow: hidden; background: transparent; }
    #root { position: relative; width: var(--cr-w); height: var(--cr-h); overflow: hidden; }
    .clip { position: absolute; inset: 0; }
    .block { position: absolute; left: 0; right: 0; text-align: center; color: var(--mask); }
    .block.top { top: 8%; } .block.center { top: 50%; transform: translateY(-50%); } .block.lower { bottom: 24%; }
    .value { font: 400 calc(var(--u) * 40)/1.1 var(--cr-display); letter-spacing: -0.02em; white-space: nowrap; }
    .mask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.12em 0.02em 0.1em; margin: -0.12em 0 -0.1em; }
    .ch { display: inline-block; }
    .label { margin-top: calc(var(--u) * 2.4); font: 500 calc(var(--u) * 4.6)/1 var(--cr-body); letter-spacing: 0.16em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stat-clip" data-start="0" data-duration="3.2">
      <div class="block" id="block">
        <div class="value" id="value"></div>
        <div class="label" id="label"></div>
      </div>
    </div>
  </div>
  <script>
    const v = window.__hyperframes.getVariables();
    const IN = 0.75, OUT = 0.45;
    const hold = Math.max(0.6, Number(v.hold) || 2.4);
    const total = Math.round((IN + hold + OUT) * 100) / 100;
    document.getElementById("stat-clip").setAttribute("data-duration", String(total));

    document.getElementById("block").classList.add(["top", "center", "lower"].includes(v.position) ? v.position : "center");
    const esc = s => s.replace(/[<&]/g, c => (c === "<" ? "&lt;" : "&amp;"));
    document.getElementById("value").innerHTML = [...String(v.value || "")].map(c => `<span class="mask"><span class="ch">${esc(c)}</span></span>`).join("");
    const label = document.getElementById("label");
    if (v.label) label.textContent = v.label; else label.remove();

    const tl = gsap.timeline({ paused: true });
    tl.from(".ch", { yPercent: 105, duration: 0.55, ease: "power3.out", stagger: 0.07 }, 0);
    if (v.label) tl.from("#label", { opacity: 0, y: 10, duration: 0.4, ease: "power2.out" }, 0.3);
    const outAt = IN + hold;
    tl.to(".ch", { yPercent: -105, duration: 0.35, ease: "power2.in", stagger: 0.04 }, outAt);
    if (v.label) tl.to("#label", { opacity: 0, duration: 0.25, ease: "power2.in" }, outAt);
    tl.set({}, {}, total);
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</body>
</html>
