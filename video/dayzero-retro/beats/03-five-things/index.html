<!doctype html>
<!-- 03-five-things: "five things I do… built two seven-figure software companies… not a one involves
     writing a line of app code": five empty task boxes, two $1M+ company chips, then every box reads
     "0 lines" and the footer confirms zero app code. Below the chest (the only room this scene has). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>03-five-things</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    #DL .win__body { display: flex; flex-direction: column; gap: calc(var(--u) * 1.3); padding: calc(var(--u) * 1.4) calc(var(--u) * 2); }
    .boxes { display: flex; gap: calc(var(--u) * 1.4); }
    .tg { flex: 1; height: calc(var(--u) * 7); border: var(--hair) solid var(--ink); display: flex; flex-direction: column; justify-content: space-between; padding: calc(var(--u) * .5) calc(var(--u) * .8); background: var(--paper); }
    .tg .n { font: calc(var(--u) * 3)/1 var(--f-pixel); }
    .tg .z { font: 400 calc(var(--u) * 1.9)/1 var(--f-mono); color: var(--ink); align-self: flex-end; background: var(--accent); padding: 0 calc(var(--u) * .4); }
    .ln { display: flex; gap: calc(var(--u) * 1.2); align-items: center; font: 400 calc(var(--u) * 2.4)/1 var(--f-mono); white-space: nowrap; }
    .ln .px { font-size: calc(var(--u) * 4); }
    #zero { margin-left: auto; }
  </style>
</head>
<body data-world="lime">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = 5.43;                          // the scene cut
    const END = 12.27, W = p => R.w(p, R.START - 0.1);
    const DL = R.win({ title: 'Day0.list', right: '5 items', variant: 'paper', x: 4, y: 111.5, w: 82, h: 'auto',
      body: `<div class="boxes">${[1, 2, 3, 4, 5].map(i => `<div class="tg h"><span class="n">0${i}</span><span class="z h">0 loc</span></div>`).join('')}</div>
        <div class="ln"><span>built:</span><span class="chip chip--world h" id="c1">✣ $1M+ co. #1</span><span class="chip chip--world h" id="c2">✣ $1M+ co. #2</span></div>
        <div class="ln h" id="foot"><span>app code required</span><span class="chip-inv" id="zero">0 lines</span></div>` });
    DL.id = 'DL';
    const op = R.open(DL, W('five'), { from: { x: 55, y: 80 } });

    // the five things: five empty boxes
    R.stagger(DL.querySelectorAll('.tg'), op + 0.08, W('that I do'), { sfx: 'tick', vol: -4 });
    // two seven-figure companies
    R.show(R.$('#c1'), W('two')); R.sfx('coin', W('two'), { vol: -6 });
    R.show(R.$('#c2'), W('figure')); R.sfx('coin', W('figure'), { vol: -4 });
    // not a one of these involves code: each box gets its zero
    R.stagger(DL.querySelectorAll('.z'), W('not a one'), W('writing'), { sfx: 'blip', vol: -6 });
    const f = W('line of app');
    R.show(R.$('#foot'), f); R.sfx('pop', f, { vol: -4 });
    R.flash(R.$('#zero'), W('code.'), 2); R.sfx('success', W('code.'), { vol: -4 });
    R.done(END);
  </script>
</body>
</html>
