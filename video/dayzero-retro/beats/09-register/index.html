<!doctype html>
<!-- 09-register: "Five, get your business registered and get started working on your DUNS number": a
     company form gets its name and a REGISTERED stamp, then the nine D-U-N-S digits fill in and a
     wait-time chip says why to start today. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>09-register</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    #FM .win__body { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); padding: calc(var(--u) * 1.6) calc(var(--u) * 2); }
    .fr { display: flex; align-items: center; gap: calc(var(--u) * 1.4); font: 400 calc(var(--u) * 2.4)/1 var(--f-mono); white-space: nowrap; }
    .fr > .k { min-width: calc(var(--u) * 13); }
    .fld { flex: 1; border: var(--hair) solid var(--ink); background: var(--paper); padding: calc(var(--u) * .8) calc(var(--u) * 1); font: calc(var(--u) * 3.6)/1 var(--f-pixel); }
    #stamp { font-size: calc(var(--u) * 4.4); }
    .dg { display: flex; gap: calc(var(--u) * .5); }
    .dg i { width: calc(var(--u) * 4.6); height: calc(var(--u) * 5.6); border: var(--hair) solid var(--ink); background: var(--paper); font: normal calc(var(--u) * 4.4)/calc(var(--u) * 5.6) var(--f-pixel); text-align: center; }
    .dg i.sp { width: calc(var(--u) * 1.4); border: 0; background: none; }
    #wait { align-self: flex-end; }
  </style>
</head>
<body data-world="green">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = 46.3;                          // the scene cut
    const END = 49.83, W = p => R.w(p, R.START - 0.1);
    const digits = '081466729';
    const cells = [...digits].map((d, i) => (i === 2 || i === 5 ? '<i class="sp">-</i>' : '') + `<i><span class="h">${d}</span></i>`).join('');
    const FM = R.win({ title: 'Form LLC-1', right: 'step 05', variant: 'paper', x: 4, y: 21, w: 82, h: 'auto',
      body: `<div class="fr"><span class="k">company</span><div class="fld"><span class="type" id="co">YourApp LLC</span></div><span class="chip-inv h" id="stamp">REGISTERED</span></div>
        <div class="fr"><span class="k">D-U-N-S</span><div class="dg">${cells}</div></div>
        <span class="chip chip--world h" id="wait">⏱ Apple wants it · up to 2 wks</span>` });
    FM.id = 'FM';
    const op = R.open(FM, W('Five,'), { from: { x: 52, y: 70 } });
    R.sfx('stab', op, { vol: -7 });
    R.type(R.$('#co'), W('business'), 30);
    const rg = W('registered') + 0.2;
    R.show(R.$('#stamp'), rg); R.sfx('thunk', rg); R.flash(R.$('#stamp'), rg + 0.07, 2);

    // the D-U-N-S number, digit by digit
    R.stagger(FM.querySelectorAll('.dg span'), W('working'), W('number.'), { sfx: 'blip', vol: -6 });
    const nb = W('number.') + 0.12;
    R.show(R.$('#wait'), nb); R.sfx('notify', nb, { vol: -4 });
    R.done(END);
  </script>
</body>
</html>
