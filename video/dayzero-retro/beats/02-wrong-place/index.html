<!doctype html>
<!-- 02-wrong-place: "but that's the wrong place to start": an alert above the head. "step 1: write app
     code" gets struck out on "wrong", and the dialog says it in display type. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>02-wrong-place</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    #AL .win__body { display: flex; gap: calc(var(--u) * 2.4); align-items: center; padding: calc(var(--u) * 1.4) calc(var(--u) * 2); }
    #AL .txt { display: flex; flex-direction: column; gap: calc(var(--u) * 1.2); }
    #st { position: relative; font: 400 calc(var(--u) * 3)/1 var(--f-mono); white-space: nowrap; }
    #st i { position: absolute; left: -2%; top: 50%; height: calc(var(--u) * .6); width: 104%; background: var(--accent); transform-origin: left; }
    #big { font-size: calc(var(--u) * 7.4); }
  </style>
</head>
<body data-world="coral">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = 3.93;                          // the scene cut
    const END = 5.43, W = p => R.w(p, R.START - 0.1);
    const stop = R.pix([
      '..kkkkk..',
      '.knnnnnk.',
      'knnpnpnnk',
      'knnnpnnnk',
      'knnpnpnnk',
      '.knnnnnk.',
      '..kkkkk..'], 1.5);
    const AL = R.win({ title: 'Alert', right: 'start.sys', variant: 'paper', x: 4, y: 21, w: 82, h: 'auto',
      body: `${stop}<div class="txt"><span id="st">step 1: write app code<i class="h" id="ln"></i></span>
        <span class="disp h" id="big">Wrong place.</span></div>` });
    AL.id = 'AL';
    R.open(AL, R.START + 4 * R.F, { sfx: 'alert', from: { x: 46, y: 50 } });

    const w = W('wrong');
    R.show(R.$('#ln'), w); R.sfx('strike', w, { vol: -3 });
    const p = W('place');
    R.show(R.$('#big'), p); R.sfx('error', p, { vol: -4 });
    R.flash(AL, W('start'), 2);
    R.done(END);
  </script>
</body>
</html>
