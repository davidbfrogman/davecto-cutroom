<!doctype html>
<!-- 11 42.00–47.50 "Instead, pick a channel. Social media, cold outbound, LinkedIn, email."
     A pixel TV set (blue) below the chest, Channel.select. It powers on with a static burst on
     "pick a channel" (thunk); the dial clicks to a new channel on each one he names: CH 02 SOCIAL
     MEDIA, CH 03 COLD OUTBOUND, CH 04 LINKEDIN, CH 05 EMAIL, with a few frames of static between
     (tick). The guide list beside it highlights the channel; the last one stays tuned. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>11-channels</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    #TV .win__body { background: var(--win); display: flex; gap: calc(var(--u) * 2); padding: calc(var(--u) * 1.6); }
    .set { flex: none; width: calc(var(--u) * 46); background: var(--ink); padding: calc(var(--u) * 1.6); display: flex; gap: calc(var(--u) * 1.6); }
    .scr { position: relative; flex: 1; background: var(--ink); border: calc(var(--u) * .6) solid var(--grey); overflow: hidden; }
    .scr canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    .ch { position: absolute; inset: 0; background: var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 1.4); visibility: hidden; }
    .ch .nm { font: calc(var(--u) * 5.4)/.9 var(--f-pixel); text-align: center; color: var(--ink); }
    .osd { position: absolute; right: calc(var(--u) * 1.2); top: calc(var(--u) * 1); font: calc(var(--u) * 4.4)/1 var(--f-pixel); color: var(--green); visibility: hidden; z-index: 2;
           text-shadow: calc(var(--u) * .3) calc(var(--u) * .3) 0 var(--ink); }
    .knobs { flex: none; width: calc(var(--u) * 8); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2); padding-top: calc(var(--u) * 1); }
    .knob { position: relative; width: calc(var(--u) * 7); height: calc(var(--u) * 7); background: var(--win-2); border: calc(var(--u) * .5) solid var(--paper); }
    .knob i { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * .9); height: calc(var(--u) * 3); margin-left: calc(var(--u) * -.45); margin-top: calc(var(--u) * -3); background: var(--ink); transform-origin: 50% 100%; }
    .grill { width: 100%; height: calc(var(--u) * 12); background: repeating-linear-gradient(var(--grey) 0 calc(var(--u) * .5), transparent 0 calc(var(--u) * 1.1)); }
    .guide { flex: 1; display: flex; flex-direction: column; gap: calc(var(--u) * .9); font: calc(var(--u) * 3.4)/1 var(--f-pixel); white-space: nowrap; min-width: 0; }
    .guide span { padding: calc(var(--u) * .3) calc(var(--u) * .7) calc(var(--u) * .6); }
  </style>
</head>
<body data-world="blue">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = 42.00;
    const ICON = {
      social: ['.kk.kk.', 'kkkkkkk', 'kkkkkkk', '.kkkkk.', '..kkk..', '...k...'],
      cold: ['kkkkkkkk', 'kk....kk', 'k.k..k.k', 'k..kk..k', 'k......k', 'kkkkkkkk'],
      linkedin: ['..kkkk..', 'kkkkkkkk', 'k......k', 'kkkkkkkk', 'k......k', 'kkkkkkkk'],
      email: ['.kkkkk.', 'k.....k', 'k.kkk.k', 'k.k.k.k', 'k.kkkk.', '.k.....', '..kkkk.'],
    };
    const CH = [['02', 'Social<br>media', 'social', 'social'], ['03', 'Cold<br>outbound', 'cold', 'cold'], ['04', 'LinkedIn', 'linkedin', 'linkedin'], ['05', 'Email', 'email', 'email']];
    const TV = R.win({ title: 'Channel.select', right: '◉ pick one', x: 6, y: 72, w: 76, h: 40,
      body: `<div class="set">
          <div class="scr"><canvas width="64" height="48"></canvas>
            ${CH.map(([n, nm, ic]) => `<div class="ch" id="ch${n}">${R.pix(ICON[ic], 1.3)}<span class="nm">${nm}</span></div>`).join('')}
            <span class="osd" id="osd">CH 01</span></div>
          <div class="knobs"><div class="knob"><i id="dial"></i></div><div class="knob"><i style="transform:rotate(-40deg)"></i></div><div class="grill"></div></div>
        </div>
        <div class="guide"><span class="micro">TV guide</span>${CH.map(([n, nm]) => `<span id="g${n}">${n} ${nm.replace('<br>', ' ')}</span>`).join('')}</div>` });
    TV.id = 'TV';
    R.open(TV, R.w('instead'), { from: { x: 45, y: 60 } });

    // Static: hashed per pixel and frame, so any frame renders the same.
    const cv = TV.querySelector('canvas'), g = cv.getContext('2d'), img = g.createImageData(64, 48);
    const hash = (x, y, k) => { let h = (x * 374761393 + y * 668265263 + k * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
    const on = R.w('pick');
    R.every(on, 47.5, t => {
      const k = Math.round(t * 15);
      for (let y = 0; y < 48; y++) for (let x = 0; x < 64; x++) {
        const v = hash(x, y, k) > 0.5 ? 222 : 30, i = (y * 64 + x) * 4;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    });
    R.show(R.$('#osd'), on);
    R.sfx('thunk', on);

    // One channel per word, static in between.
    const at = [R.w('social'), R.w('cold'), R.w('linkedin'), R.w('email')];
    const dial = R.$('#dial'), guide = n => R.$('#g' + n);
    CH.forEach(([n], i) => {
      const t = at[i], el = R.$('#ch' + n), off = at[i + 1] ?? 99;
      R.show(el, t + 2 * R.F);
      if (at[i + 1]) R.hide(el, off);
      R.text(R.$('#osd'), t, `CH ${n}`);
      R.tl.set(dial, { rotate: (i + 1) * 45 }, R.T(t));
      R.tl.set(guide(n), { backgroundColor: 'var(--ink)', color: 'var(--accent)' }, R.T(t));
      if (at[i + 1]) R.tl.set(guide(n), { backgroundColor: 'transparent', color: 'var(--ink)' }, R.T(off));
      R.sfx('tick', t);
      R.sfx('blip', t + 2 * R.F, { freq: 900 + i * 150, vol: -6 });
    });
    R.text(TV.querySelector('.win__bar .r'), at[3] + 0.3, '◉ tuned');
    R.done(47.5);
  </script>
</body>
</html>
