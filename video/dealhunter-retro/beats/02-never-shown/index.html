<!doctype html>
<!-- 02-never-shown: "even the ones that were never advertised to you": above the head. Your feed, as a skeleton ad
     whose code line is still scrambling; "NEVER SHOWN TO YOU" stamps across it on "never". -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>02-never-shown</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    .ad { position: relative; display: grid; grid-template-columns: calc(var(--u) * 7) 1fr; gap: calc(var(--u) * 1.4) calc(var(--u) * 1.6); }
    .av { width: calc(var(--u) * 7); height: calc(var(--u) * 7); background: var(--ink); }
    .hd { display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 1); }
    .bar { height: calc(var(--u) * 1.8); background: var(--win-2); }
    .txt { grid-column: 1 / 3; display: flex; flex-direction: column; gap: calc(var(--u) * 1.1); }
    .code { font: calc(var(--u) * 4.6)/1 var(--f-pixel); background: var(--accent); padding: calc(var(--u) * .4) calc(var(--u) * 1); align-self: flex-start; white-space: pre; }
    .stamp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: calc(var(--u) * 6.4);
             padding: calc(var(--u) * .6) calc(var(--u) * 1.8) calc(var(--u) * 1); border: var(--hair) solid var(--accent); }
  </style>
</head>
<body data-world="yellow">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = 3.5;
    const END = 5.57, W = p => R.w(p, R.START - 0.1);
    const GL = '▓▒░#%&@$?!*';

    const A = R.win({ title: 'Your.Feed', right: 'impressions: 0', variant: 'paper', x: 9, y: 24, w: 82, h: 'auto',
      body: `<div class="ad"><div class="av"></div><div class="hd"><div class="bar" style="width:60%"></div><div class="bar" style="width:32%"></div></div>` +
        `<div class="txt"><div class="bar"></div><div class="bar" style="width:86%"></div><div class="code" id="code">CODE: ▓▓▓▓▓▓▓▓▓</div><div class="bar" style="width:70%"></div></div>` +
        `<span class="chip-inv stamp h" id="stamp">✕ NEVER SHOWN TO YOU</span></div>` });
    R.open(A, R.START, { from: { x: 42, y: 80 } });

    // the code is in there, you just can't read it
    R.every(R.START, END, t => { R.seed(Math.floor(t * 15) * 5 + 3); let o = ''; for (let i = 0; i < 9; i++) o += GL[Math.floor(R.rnd() * GL.length)]; R.$('#code').textContent = 'CODE: ' + o; });

    R.show(R.$('#stamp'), W('never'));
    R.sfx('error', W('never'), { vol: -6 });
    R.flash(R.$('#stamp'), W('you.'), 1);
    R.done(END);
  </script>
</body>
</html>
