<!doctype html>
<!-- 11-assignments: "So if you want the link to the repo plus my 10 overnight assignments I'd suggest using with this
     thing". Below the chest. A collectible card pack: the legendary REPO card lands on "repo", then ten assignment
     cards deal into a fan over "10 overnight assignments"; the rare Flake Exterminator glints on "suggest". -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>11-assignments</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <script src="shifty.js"></script>
  <style>
    .u { position: absolute; }
    .card { width: calc(var(--u) * 14); height: calc(var(--u) * 20); background: var(--paper); border: var(--hair) solid var(--ink);
            box-shadow: calc(var(--u) * .4) calc(var(--u) * .4) 0 var(--ink-55); transform-origin: 50% 140%; }
    .card .hd { background: var(--ink); color: var(--accent); font: calc(var(--u) * 2.6)/1 var(--f-pixel); padding: calc(var(--u) * .5) calc(var(--u) * .6); }
    .card .art { display: grid; place-items: center; height: calc(var(--u) * 9.6); border-bottom: var(--hair) solid var(--ink); background: var(--win); }
    .card .nm { font: calc(var(--u) * 2.4)/1.05 var(--f-pixel); padding: calc(var(--u) * .5) calc(var(--u) * .6) 0; }
    .card .rr { position: absolute; bottom: calc(var(--u) * .4); left: calc(var(--u) * .6); font: calc(var(--u) * 2.4)/1 var(--f-pixel); color: var(--accent); text-shadow: 0 0 0 var(--ink); }
    .card.leg { background: var(--accent); }
    .card.leg .art { background: var(--accent); }
    .cnt { font: calc(var(--u) * 3.4)/1 var(--f-pixel); }
  </style>
</head>
<body data-world="pink">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = R.w("So if you", 0);
    const END = 40.62, W = p => R.w(p, R.START - 0.1);
    const A = R.win({ title: 'Assignments.deck', right: '0/10 collected', variant: 'paper', x: 9, y: 93, w: 82, h: 45 });
    const B = A.querySelector('.win__body'), box = (cls, g, html = '') => R.box('u ' + cls, { parent: B, ...g, html });
    R.open(A, W('want'), { from: { x: 52, y: 80 } });

    const card = (cls, hd, art, nm, rr) => `<div class="hd">${hd}</div><div class="art">${art}</div><div class="nm">${nm}</div><div class="rr">${rr}</div>`;
    // the legendary one
    const leg = box('card leg h', { x: 2, y: 4 }, card('', '#00 · REPO', R.pix(SH.trophy, 0.55), 'THE REPO<br>itself', '★★★★★'));
    R.show(leg, W('repo')); SH.flash(leg, W('repo'), 2); R.sfx('chest', W('repo') - 0.3, { vol: -10 });
    const plus = box('cnt h', { x: 18, y: 12 }, '+'); R.show(plus, W('plus'));

    const deck = [['BUG HUNTER', 'safari', '★★'], ['SECURITY AUDITOR', 'cap', '★★★'], ['TEST ENGINEER', 'hard', '★'], ['PERF DETECTIVE', 'fedora', '★★'],
      ['DEBT COLLECTOR', 'fedora', '★★'], ['NEW HIRE', 'none', '★'], ['DEPENDENCY JANITOR', 'cap', '★'], ['TYPE TIGHTENER', 'hard', '★★'],
      ['SILENT FAILURE FINDER', 'safari', '★★★'], ['FLAKE EXTERMINATOR', 'cap', '★★★★']];
    const t0 = W('10'), t1 = W('assignments') + 0.3;
    const cards = deck.map(([nm, hat, rr], i) => {
      const k = i - 4.5, el = box('card h', { x: 23 + i * 3.9, y: 4 + Math.abs(k) * 0.5 }, card('', `#${String(i + 1).padStart(2, '0')}`, SH.pix({ hat, mouth: 'happy' }, 0.38), nm, rr));
      el.style.transform = `rotate(${k * 4}deg)`;
      return el;
    });
    const ts = R.stagger(cards, t0, t1, { sfx: 'select', vol: -8 });
    R.count(A.querySelector('.r'), t0, t1 - t0, 1, 10, v => `${Math.round(v)}/10 collected`);
    const rare = cards[9];
    SH.flash(rare, W('suggest'), 3);
    R.sfx('sparkle', W('suggest'), { vol: -6 });
    R.sfx('keyget', W('thing,'), { vol: -10 });
    R.done(END);
  </script>
</body>
</html>
