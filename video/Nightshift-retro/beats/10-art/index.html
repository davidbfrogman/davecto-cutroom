<!doctype html>
<!-- 10-art: "Now there is an art to picking the kinds of things that you'd want an AI to do while you're asleep":
     above the head (the face is low). Task.Sorter: jobs drop in at the top and step into "Overnight" or
     "Needs you"; the overnight column goes to sleep (zZ blinking) on "asleep". -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>10-art</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    .cols { position: relative; height: calc(var(--u) * 33); }
    .colh { position: absolute; top: calc(var(--u) * 6.2); font-size: calc(var(--u) * 4); }
    .card { position: absolute; width: calc(var(--u) * 36); height: calc(var(--u) * 4.6); display: flex; align-items: center;
            padding: 0 calc(var(--u) * 1.2); font: calc(var(--u) * 3.6)/1 var(--f-pixel); border: var(--hair) solid var(--ink);
            background: var(--paper); box-shadow: calc(var(--u) * .4) calc(var(--u) * .4) 0 var(--ink-55); white-space: nowrap; }
    .inbox { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u) * 4.6); border: var(--hair) dashed var(--ink-55); }
    .mid { position: absolute; left: calc(50% - var(--hair) / 2); top: calc(var(--u) * 6.2); bottom: 0; border-left: var(--hair) solid var(--ink); }
    #art { position: absolute; left: calc(var(--u) * 1.2); top: calc(var(--u) * 1); font: calc(var(--u) * 2.6)/1 var(--f-mono); }
  </style>
</head>
<body data-world="pink">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    // R.flash inverts colours, and inverted pink is green: this inverts lightness only, so pink stays pink.
    R.flash = (el, t, n = 2) => { for (let i = 0; i < n; i++) { R.tl.set(el, { filter: 'invert(1) hue-rotate(180deg)' }, R.T(t) + i * 2 * R.F); R.tl.set(el, { filter: 'none' }, R.T(t) + (i * 2 + 1) * R.F); } };
    R.START = R.w("Now there is", 0);
    const END = 35.5, W = p => R.w(p, R.START - 0.1);
    // [job, column (0 overnight, 1 needs you), word it lands on]
    const jobs = [['Write the tests', 0, 'picking'], ['Pick the brand colours', 1, 'kinds'], ['Bump dependencies', 0, 'things'],
                  ['Fix the flaky build', 0, 'want'], ['Call a customer', 1, 'AI'], ['Clean up old branches', 0, 'do']];
    const X = [0, 40.4], rowY = [11.6, 11.6], CX = 20.2;

    const A = R.win({ title: 'Task.Sorter', right: 'the art of picking', variant: 'paper', x: 9, y: 22, w: 82, h: 'auto',
      body: `<div class="cols"><div class="inbox"></div><span id="art" class="h">✣ which ones can run without you?</span>
               <span class="chip-inv colh" style="left:0" id="nh">☾ OVERNIGHT</span>
               <span class="chip colh" style="left:calc(var(--u) * 40.4)">☀ NEEDS YOU</span><div class="mid"></div>
               ${jobs.map(([j], i) => `<div class="card h" id="j${i}">${j}</div>`).join('')}</div>` });
    R.open(A, W('Now'), { from: { x: 50, y: 70 } });
    R.show(R.$('#art'), W('art'));
    R.hide(R.$('#art'), W(jobs[0][2]));

    jobs.forEach(([, col, word], i) => {
      const el = R.$('#j' + i), t = W(word), y = rowY[col];
      rowY[col] += 5.4;
      R.show(el, t);
      R.path(el, [[t, CX, 0], [t + 0.07, CX, 0], [t + 0.27, X[col], y]]);
      R.sfx(col ? 'cancel' : 'select', t, { vol: -5 });
    });

    // the overnight column falls asleep
    R.text(R.$('#nh'), W('asleep.'), '☾ OVERNIGHT zZ');
    R.flash(R.$('#nh'), W('asleep.'), 1);
    R.sfx('starfall', W('asleep.'), { vol: -10 });
    R.done(END);
  </script>
</body>
</html>
