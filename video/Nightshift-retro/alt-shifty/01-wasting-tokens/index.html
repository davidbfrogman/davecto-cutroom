<!doctype html>
<!-- 01-wasting-tokens: "If you're paying for Claude or ChatGPT and you feel like you're wasting tokens". Below the chest.
     Shifty idles at a dark monitor while a TOKENS pipe pours pink coins down a drain; the pipe's tag reads
     Claude, then ChatGPT; on "wasting" the flow doubles, the drain gurgles, Shifty gasps and the meter runs. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>01-wasting-tokens</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <script src="shifty.js"></script>
  <style>
    .u { position: absolute; }
    .desk { background: var(--ink); }
    .mon { border: var(--hair) solid var(--ink); background: var(--ink); color: var(--accent); font: calc(var(--u) * 3)/1 var(--f-pixel);
           display: grid; place-items: center; box-shadow: inset 0 0 0 calc(var(--u) * .5) var(--win-2); }
    .pipe { background: var(--win-2); border: var(--hair) solid var(--ink); }
    .pipe span { position: absolute; left: calc(var(--u) * 4.6); top: calc(var(--u) * .5); font: calc(var(--u) * 3)/1 var(--f-pixel); }
    .tag { font-size: calc(var(--u) * 3.2); }
    .zz { font: calc(var(--u) * 3.4)/1 var(--f-pixel); }
    .grate { background: repeating-linear-gradient(90deg, var(--ink) 0 calc(var(--u) * 1), var(--paper) calc(var(--u) * 1) calc(var(--u) * 1.8)); border: var(--hair) solid var(--ink); }
    .meter { text-align: right; }
    .meter b { display: block; font: 400 calc(var(--u) * 7)/.9 var(--f-pixel); }
    .meter small { font: calc(var(--u) * 2.4)/1 var(--f-mono); }
  </style>
</head>
<body data-world="pink">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = R.w("If you're paying", 0);
    const END = 3.14, W = p => R.w(p, R.START - 0.1);
    const A = R.win({ title: 'Night.Office', right: 'agent: idle', variant: 'paper', x: 9, y: 106, w: 82, h: 34 });
    const B = A.querySelector('.win__body'), box = (cls, g, html = '') => R.box('u ' + cls, { parent: B, ...g, html });

    // Shifty, idle, blinking, behind his desk
    const sh = box('', { x: 4, y: 3 }, SH.anim([{ hat: 'dark' }, { hat: 'dark' }, { hat: 'dark' }, { hat: 'dark', eyes: 'blink' }], 0.95));
    const shock = box('h', { x: 4, y: 3 }, SH.pix({ hat: 'dark', eyes: 'wide', mouth: 'o', body: 'up' }, 0.95));
    const bang = box('zz h', { x: 18, y: 1 }, '!!');
    const zz = box('zz', { x: 18, y: 1 }, 'z<sup>z</sup>');
    box('mon', { x: 17, y: 11, w: 14, h: 9.4 }, '<span id="idle">IDLE</span>');
    box('desk', { x: 1, y: 20.6, w: 34, h: 1.4 });
    box('desk', { x: 3, y: 20.6, w: 1.4, h: 6 }); box('desk', { x: 31, y: 20.6, w: 1.4, h: 6 });

    // the pipe, the coins, the drain
    box('pipe', { x: 55, y: 1, w: 30, h: 5.4 }, '<span>TOKENS ◀</span>').dataset.bleed = '';
    box('pipe', { x: 51.6, y: 1, w: 5.4, h: 9 });
    const tag = box('chip-inv tag h', { x: 60, y: 7.4 }, 'CLAUDE');
    box('grate', { x: 46, y: 24, w: 17, h: 2.4 });
    const meter = box('meter', { x: 64, y: 13, w: 15 }, '<b id="usd">$0.00</b><small>down the drain</small>');

    const N = 3, coins = Array.from({ length: N }, () => box('h', { x: 52.4, y: 10 }, R.pix(SH.coin, 0.7)));
    const a = 0.32, w = W('wasting'), v1 = 13, v2 = 34, y0 = 9.6, span = 14.4;
    const dist = t => (Math.min(t, w) - a) * v1 + Math.max(0, t - w) * v2;
    R.every(a, END, t => coins.forEach((c, i) => {
      const y = (dist(t) + i * span / N) % span;
      c.style.top = R.u(y0 + y);
      c.style.left = R.u(52.4 + (Math.floor((dist(t) + i * 3) / 4) % 2 ? 0.5 : -0.5));
    }));
    R.open(A, 0.3, { from: { x: 55, y: 92 } });
    coins.forEach(c => R.show(c, a));
    R.count(R.$('#usd'), a, w - a, 0, 1.38, v => `$${v.toFixed(2)}`);
    R.count(R.$('#usd'), w, END - w - 0.1, 1.38, 6.66, v => `$${v.toFixed(2)}`);
    R.blink(R.$('#idle'), 0.3, END, 0.6);

    R.show(tag, W('clotter')); R.sfx('pop', W('clotter'), { vol: -5 });
    R.text(tag, W('chat'), 'CHATGPT'); SH.flash(tag, W('chat'), 1); R.sfx('pop', W('chat'), { vol: -5 });

    // "wasting": the flow doubles and Shifty gasps
    R.hide(sh, w); R.hide(zz, w); R.show(shock, w); R.show(bang, w); R.blink(bang, w, END, 0.27);
    SH.flash(meter, w, 2);
    R.sfx('pipe', w, { vol: -2 });
    R.sfx('drop', W('tokens'), { vol: -6 });
    R.done(END);
  </script>
</body>
</html>
