<!doctype html>
<!-- 12-comment: "comment night shift below and I'll send them to you for free and follow along for more tips on building
     with AI". Below the chest. "night shift" types into the comment box and posts on "below"; Shifty catches the
     comment, folds it into a paper plane and sends it off ("SENT ✓ FREE"); on "follow" he jumps onto the Follow
     button and it turns pink. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>12-comment</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <script src="shifty.js"></script>
  <style>
    .u { position: absolute; }
    .field { background: var(--paper); border: var(--hair) solid var(--ink); font: calc(var(--u) * 4.6)/calc(var(--u) * 6.4) var(--f-pixel); padding: 0 calc(var(--u) * 1.2); }
    #cur { background: var(--ink); color: var(--accent); }
    .btn { background: var(--ink); color: var(--paper); font: calc(var(--u) * 4)/calc(var(--u) * 6.4) var(--f-pixel); text-align: center; box-shadow: calc(var(--u) * .5) calc(var(--u) * .5) 0 var(--ink-55); }
    .bub { background: var(--accent); border: var(--hair) solid var(--ink); font: calc(var(--u) * 3)/1 var(--f-pixel); padding: calc(var(--u) * .6) calc(var(--u) * .8); white-space: nowrap; }
    .fol { background: var(--paper); color: var(--ink); border: var(--hair) solid var(--ink); font: calc(var(--u) * 4.6)/calc(var(--u) * 7.6) var(--f-pixel); text-align: center;
           box-shadow: calc(var(--u) * .5) calc(var(--u) * .5) 0 var(--ink-55); }
  </style>
</head>
<body data-world="pink">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = R.w("comment night", 0);
    const END = 45.06, W = p => R.w(p, R.START - 0.1);
    const A = R.win({ title: 'Comments', right: 'Nightshift playbook', variant: 'paper', x: 9, y: 93, w: 82, h: 45 });
    const B = A.querySelector('.win__body'), box = (cls, g, html = '') => R.box('u ' + cls, { parent: B, ...g, html });
    R.open(A, R.START, { from: { x: 55, y: 80 } });

    box('field', { x: 0, y: 0, w: 58, h: 7 }, '<span class="type" id="txt">night shift</span><span id="cur">█</span>');
    const post = box('btn', { x: 61, y: 0, w: 16, h: 7 }, 'Post ▶');
    R.type(R.$('#txt'), W('night'), 16);
    R.blink(R.$('#cur'), W('shift') + 0.3, END, 0.5);
    const tb = W('below');
    R.press(post, tb); R.text(post, tb, 'Posted ✓');

    // Shifty catches it
    const c = 0.85, sx = 6, sy = 14.6;
    const stand = box('', { x: sx, y: sy }, SH.pix({ mouth: 'happy' }, c));
    const catcher = box('h', { x: sx, y: sy }, SH.pix({ body: 'up', mouth: 'grin', eyes: 'stars' }, c));
    const bub = box('bub h', { x: 22, y: 1.2 }, 'night shift');
    R.show(bub, tb + 0.07);
    R.path(bub, [[tb + 0.07, 22, 1.2], [W('and', tb) + 0.1, sx + 1, sy - 4]]);
    R.hide(stand, W('I\'ll')); R.show(catcher, W('I\'ll'));
    R.sfx('heart', W('I\'ll'), { vol: -6 });

    // folds it into a plane and sends it
    const ts = W('send');
    R.hide(bub, ts);
    const plane = box('h', { x: sx + 6, y: sy - 4 }, R.pix(SH.plane, 0.9)); plane.dataset.bleed = '';
    R.show(plane, ts);
    R.path(plane, [[ts, sx + 6, sy - 4], [W('free') + 0.1, 70, 8], [W('free') + 0.4, 84, 2]]);
    R.sfx('boomerang', ts, { vol: -8 });
    const sent = box('chip-inv h', { x: 30, y: 10, style: { fontSize: 'calc(var(--u) * 3.6)' } }, 'SENT ✓ FREE');
    R.show(sent, W('free')); R.sfx('coin', W('free'), { vol: -6 });

    // and jumps on Follow
    const fol = box('fol', { x: 46, y: 25, w: 30, h: 8 }, '+ Follow');
    const tf = W('follow');
    R.hide(catcher, tf); const jumper = box('h', { x: sx, y: sy }, SH.pix({ body: 'up', mouth: 'grin' }, c)); R.show(jumper, tf);
    const land = W('along');
    R.path(jumper, [[tf, sx, sy], [tf + 0.13, 26, 2], [land, 54, 8.2]]);
    R.sfx('bigjump', tf, { vol: -6 });
    R.press(fol, land);
    R.text(fol, land, '✓ Following');
    R.tl.set(fol, { background: 'var(--accent)' }, R.T(land));
    R.sfx('success', land + 0.07, { vol: -6 });
    R.done(END);
  </script>
</body>
</html>
