<!doctype html>
<!-- 11-assignments: "So if you want the link to the repo plus my 10 overnight assignments I'd suggest using with
     this thing": below the chest. Night.Shift.Kit: the repo link chip on "repo", "+" on "plus", then ten
     assignment files stack in 01 → 10 over "10 overnight assignments". -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>11-assignments</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    .top { display: flex; align-items: center; gap: calc(var(--u) * 1.6); margin-bottom: calc(var(--u) * 2); font: calc(var(--u) * 4.4)/1 var(--f-pixel); }
    .top .chip { font-size: calc(var(--u) * 4.4); }
    .files { display: grid; grid-template-columns: repeat(10, 1fr); gap: calc(var(--u) * 1); }
    .f { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * .6); font: calc(var(--u) * 3.2)/1 var(--f-pixel); }
    .f i { position: relative; width: calc(var(--u) * 5.4); height: calc(var(--u) * 6.6); border: var(--hair) solid var(--ink); background: var(--paper);
           background-image: repeating-linear-gradient(to bottom, transparent 0 calc(var(--u) * 1.2), var(--win-2) calc(var(--u) * 1.2) calc(var(--u) * 1.6)); background-clip: content-box;
           padding: calc(var(--u) * 1.8) calc(var(--u) * .7) calc(var(--u) * .6); }
    .f i::before { content: ''; position: absolute; right: calc(var(--hair) * -1); top: calc(var(--hair) * -1); width: calc(var(--u) * 1.6); height: calc(var(--u) * 1.6); background: var(--ink); }
    .f:last-child i { background-color: var(--accent); }
  </style>
</head>
<body data-world="pink">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = R.w("So if you", 0);
    const END = 40.62, W = p => R.w(p, R.START - 0.1);

    const A = R.win({ title: 'Night.Shift.Kit', right: '0 files', variant: 'paper', x: 9, y: 94, w: 82, h: 'auto',
      body: `<div class="top"><span class="chip h" id="link">↗ Link to the repo</span><span class="h" id="plus">+</span><span class="h" id="asg">Overnight assignments</span></div>
             <div class="files">${Array.from({ length: 10 }, (_, i) => `<div class="f h"><i></i>${String(i + 1).padStart(2, '0')}</div>`).join('')}</div>` });
    R.open(A, W('want'), { from: { x: 52, y: 80 } });
    R.show(R.$('#link'), W('repo'));
    R.sfx('pop', W('repo'), { vol: -4 });
    R.show(R.$('#plus'), W('plus'));
    R.show(R.$('#asg'), W('overnight'));
    const ts = R.stagger('.f', W('10'), W('I\'d'), { sfx: 'tick', vol: -4 });
    R.count(A.querySelector('.r'), W('10'), W('I\'d') - W('10'), 1, 10, v => `${Math.round(v)} files`);
    R.sfx('itemget', W('I\'d'), { vol: -8 });
    R.done(END);
  </script>
</body>
</html>
