<!doctype html>
<!-- 02-every-night: "every night before you go to bed, you might wanna check out this free GitHub repo": below the
     chest. Night.Clock runs 23:00 → 07:00 while the agent sits idle (eight grey hours, zero tokens); it closes
     and GitHub.Repo opens on "free". -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>02-every-night</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    .clk { display: flex; align-items: center; gap: calc(var(--u) * 3); }
    #time { font: calc(var(--u) * 13)/.8 var(--f-pixel); }
    .side { flex: 1; display: flex; flex-direction: column; align-items: flex-end; gap: calc(var(--u) * 1.4); font: calc(var(--u) * 4)/1 var(--f-pixel); }
    .hrs { display: flex; gap: calc(var(--u) * .4); margin-top: calc(var(--u) * 1.6); }
    .hrs i { flex: 1; height: calc(var(--u) * 2.8); border: var(--hair) solid var(--ink); background: var(--win-2); }
    .lbl { display: flex; justify-content: space-between; margin-top: calc(var(--u) * .8); }
    .repo { display: flex; align-items: center; gap: calc(var(--u) * 3); }
    .free { font-size: calc(var(--u) * 15); background: var(--accent); padding: 0 calc(var(--u) * 1.6) calc(var(--u) * 1.4); }
    .meta { display: flex; flex-direction: column; gap: calc(var(--u) * 1.4); font: calc(var(--u) * 4.2)/1 var(--f-pixel); }
  </style>
</head>
<body data-world="pink">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = R.w("every night", 0);
    const END = 6.43, W = p => R.w(p, R.START - 0.1);
    const moon = R.pix(['..kkkk..', '.knnk...', 'knnk....', 'knnk....', 'knnk....', 'knnk....', '.knnk...', '..kkkk..'], 1.1);
    const hh = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(Math.floor(m % 60)).padStart(2, '0')}`;

    const C = R.win({ title: 'Night.Clock', right: 'agent: idle', variant: 'paper', x: 9, y: 96, w: 82, h: 'auto', layer: 'clock',
      body: `<div class="clk">${moon}<span id="time">23:00</span><div class="side"><span>Tokens used</span><span id="zz">0 · zZ</span></div></div>
             <div class="hrs">${'<i class="h"></i>'.repeat(8)}</div><div class="lbl micro"><span>23:00</span><span>Hours idle</span><span>07:00</span></div>` });
    R.open(C, R.START, { from: { x: 54, y: 70 } });
    R.count(R.$('#time'), W('night'), 1.4, 23 * 60, 31 * 60, hh);
    R.stagger('.hrs i', W('night'), W('night') + 1.4, { sfx: false });
    R.blink(R.$('#zz'), W('bed,'), W('this'), 0.4);
    R.sfx('tick', W('night'), { vol: -6, layer: 'clock' });
    R.sfx('pause', W('bed,'), { vol: -6, layer: 'clock' });
    R.close(C, W('this'));

    const G = R.win({ title: 'GitHub.Repo', right: '★ open source', variant: 'paper', x: 9, y: 96, w: 82, h: 'auto', layer: 'repo',
      body: `<div class="repo"><span class="disp free">Free.</span><div class="meta"><span>No plan. No card.</span><span class="type" id="gh">git clone ▶▶▶</span></div></div>` });
    R.open(G, W('free'), { from: { x: 50, y: 110 } });
    R.sfx('coin', W('free'), { vol: -4, layer: 'repo' });
    R.type(R.$('#gh'), W('GitHub'), 30);
    R.done(END);
  </script>
</body>
</html>
