<!doctype html>
<!-- 08-decisions: "it can make those decisions on your behalf, document why it made them and keep on working": below
     the chest. Decision.Log: the choice types on "decisions", the why on "document why", then the task bar keeps
     filling (3/12 → 9/12) on "keep on working". -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>08-decisions</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    .ln { display: block; font: calc(var(--u) * 3.3)/1.2 var(--f-mono); margin-bottom: calc(var(--u) * 1); }
    .ln b { font-weight: 400; background: var(--accent); }
    .seg { gap: calc(var(--u) * .35); margin-top: calc(var(--u) * .6); }
    .seg i { height: calc(var(--u) * 2.4); background: var(--paper); }
    .ft { display: flex; align-items: center; gap: calc(var(--u) * 1.6); margin-top: calc(var(--u) * .6); }
    .ft .seg { flex: 1; margin: 0; }
    #ok { font-size: calc(var(--u) * 3.4); }
  </style>
</head>
<body data-world="pink">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = R.w("it can make", 0);
    const END = 28.4, W = p => R.w(p, R.START - 0.1);
    const DONE = 3, TO = 9, N = 12;

    const A = R.win({ title: 'Decision.Log', right: `tasks ${DONE}/${N}`, variant: 'paper', x: 9, y: 113, w: 82, h: 'auto',
      body: `<span class="ln type" id="l1">▶ Chose: add a view, keep the table</span>
             <span class="ln type" id="l2">  Why: nothing on the API breaks</span>
             <div class="ft">${R.seg(N)}<span class="chip-inv h" id="ok">✓ WHY LOGGED</span></div>` });
    R.open(A, W('can'), { from: { x: 40, y: 100 } });
    const cells = R.$$('.seg i');
    cells.slice(0, DONE).forEach(c => (c.style.background = 'var(--ink)'));

    R.type(R.$('#l1'), W('decisions'), 34);
    R.sfx('confirm', W('decisions'), { vol: -6 });
    R.type(R.$('#l2'), W('document'), 34);
    R.show(R.$('#ok'), W('them'));
    R.sfx('pop', W('them'), { vol: -4 });

    // keep on working
    const a = W('keep'), b = END - 0.2;
    cells.slice(DONE, TO).forEach((c, i) => R.tl.set(c, { background: i === TO - DONE - 1 ? 'var(--accent)' : 'var(--ink)' }, R.T(a + (b - a) * i / (TO - DONE - 1))));
    R.count(A.querySelector('.r'), a, b - a, DONE, TO, v => `tasks ${Math.round(v)}/${N}`);
    for (let i = 0; i < TO - DONE; i += 2) R.sfx('tick', a + (b - a) * i / (TO - DONE - 1), { vol: -6 });
    R.done(END);
  </script>
</body>
</html>
