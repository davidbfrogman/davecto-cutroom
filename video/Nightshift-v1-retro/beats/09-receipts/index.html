<!doctype html>
<!-- 09-receipts: "And when you wake up, it'll be excited to show you the receipts": left of the head (small face,
     a tall narrow column). Receipt.txt prints line by line from "wake up"; on "receipts" the total lands in pink. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>09-receipts</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    .rc { font: calc(var(--u) * 3.6)/1 var(--f-pixel); display: flex; flex-direction: column; gap: calc(var(--u) * 1.1); }
    .rc div { display: flex; justify-content: space-between; }
    .hd { text-align: center; display: block !important; }
    .hd b { display: block; font: 600 calc(var(--u) * 5.4)/.9 var(--f-display); letter-spacing: -0.045em; margin-bottom: calc(var(--u) * .8); }
    .cut { border-top: var(--hair) dashed var(--ink); }
    #tot { background: var(--accent); padding: calc(var(--u) * .5) calc(var(--u) * .6) calc(var(--u) * .7); font-size: calc(var(--u) * 4.2); }
  </style>
</head>
<body data-world="pink">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = R.w("when you wake", 0);
    const END = 30.83, W = p => R.w(p, R.START - 0.1);
    const lines = [['✓ Login bug', 'fixed'], ['✓ Tests', '+14'], ['✓ Deps', 'bumped'], ['✓ Decisions', '3']];

    const A = R.win({ title: 'Receipt.txt', right: '07:00', variant: 'paper', x: 9, y: 34, w: 30, h: 'auto',
      body: `<div class="rc"><div class="hd"><b>Night shift</b>23:00 → 07:00</div><div class="cut"></div>
             ${lines.map(([a, b]) => `<div class="h ln"><span>${a}</span><span>${b}</span></div>`).join('')}
             <div class="cut"></div><div class="h" id="tot"><span>TOTAL</span><span>12/12 ✓</span></div></div>` });
    R.open(A, W('wake'), { from: { x: 48, y: 60 } });
    R.stagger('.ln', W('excited'), W('the'), { sfx: 'tick', vol: -4 });
    R.show(R.$('#tot'), W('receipts.'));
    R.flash(R.$('#tot'), W('receipts.'), 1);
    R.sfx('coin', W('receipts.'), { vol: -4 });
    R.done(END);
  </script>
</body>
</html>
