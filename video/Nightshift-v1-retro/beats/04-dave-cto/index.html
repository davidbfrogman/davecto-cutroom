<!doctype html>
<!-- 04-dave-cto: "By the way, I'm Dave, your CTO on trying to help you build cool stuff with AI": below the chest.
     About This CTO: a pixel portrait, "Dave" lands on his name, an inverted CTO chip on "CTO", and a build bar
     fills while "build cool stuff with AI" types out. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>04-dave-cto</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    .ab { display: flex; gap: calc(var(--u) * 3.2); align-items: center; }
    .face { border: var(--hair) solid var(--ink); background: var(--accent); padding: calc(var(--u) * 1); }
    .col { flex: 1; display: flex; flex-direction: column; gap: calc(var(--u) * 1.8); }
    .nm { display: flex; align-items: center; gap: calc(var(--u) * 2); }
    #name { font-size: calc(var(--u) * 11); }
    #cto { font-size: calc(var(--u) * 5); }
    #job { font: calc(var(--u) * 4.2)/1 var(--f-pixel); }
    .seg i { height: calc(var(--u) * 2.2); }
  </style>
</head>
<body data-world="pink">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = R.w("By the way", 0);
    const END = 11.77, W = p => R.w(p, R.START - 0.1);
    const me = R.pix(['..kkkkkk..', '.kkkkkkkk.', '.kppppppk.', '.kkkpkkkk.', '.kkkpkkkk.', '.kppppppk.', '.kppkkppk.', '..kppppk..', '...kkkk...', '.kkkkkkkk.', 'kkkkkkkkkk'], 1.5);

    const A = R.win({ title: 'About This CTO', right: 'v1.0', variant: 'paper', x: 9, y: 96, w: 82, h: 'auto',
      body: `<div class="ab"><div class="face">${me}</div><div class="col">
               <div class="nm"><span class="disp h" id="name">Dave</span><span class="chip-inv h" id="cto">YOUR CTO</span></div>
               <span class="type" id="job">Building cool stuff with AI</span>
               ${R.seg(10)}</div></div>` });
    R.open(A, R.START, { from: { x: 50, y: 70 } });
    R.show(R.$('#name'), W('Dave,'));
    R.sfx('stab', W('Dave,'), { vol: -6 });
    R.show(R.$('#cto'), W('CTO'));
    R.flash(R.$('#cto'), W('CTO'), 1);
    R.sfx('pop', W('CTO') + 0.07, { vol: -4 });
    R.type(R.$('#job'), W('help'), 28);
    R.$$('.seg i').forEach((c, i) => R.tl.set(c, { background: i === 9 ? 'var(--accent)' : 'var(--ink)' }, R.T(W('help') + i * 0.1)));
    R.blink(R.$$('.seg i')[9], W('help') + 1.0, END, 0.4);
    R.done(END);
  </script>
</body>
</html>
