<!doctype html>
<!-- 06-rad: "But here's the part that's especially rad.": above the head. Rad.Meter fills from "especially" and
     pegs past the end on "rad": 11/10, the last cell pink, an inverted flash. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>06-rad</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    .rd { display: flex; align-items: center; gap: calc(var(--u) * 2); }
    .rd .disp { font-size: calc(var(--u) * 5.6); white-space: nowrap; }
    #val { font: calc(var(--u) * 5.6)/.8 var(--f-pixel); width: calc(var(--u) * 11); text-align: right; }
    .seg { flex: 1; gap: calc(var(--u) * .35); }
    .seg i { height: calc(var(--u) * 3.4); background: var(--paper); }
  </style>
</head>
<body data-world="pink">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = R.w("But here's", 0);
    const END = 19.22, W = p => R.w(p, R.START - 0.1);
    const A = R.win({ title: 'Rad.Meter', right: 'the part that’s ▶▶▶', variant: 'paper', x: 9, y: 21, w: 82, h: 'auto',
      body: `<div class="rd"><span class="disp">Rad</span>${R.seg(11)}<span id="val">0/10</span></div>` });
    R.open(A, R.START, { from: { x: 55, y: 60 } });
    const cells = R.$$('.seg i'), a = W('especially'), b = W('rad.');
    cells.slice(0, 10).forEach((c, i) => R.tl.set(c, { background: 'var(--ink)' }, R.T(a + (b - a) * i / 10)));
    R.count(R.$('#val'), a, b - a, 0, 10, v => `${Math.round(v)}/10`);
    R.sfx('arpup', a - 0.3, { vol: -8 });
    R.tl.set(cells[10], { background: 'var(--accent)' }, R.T(b));
    R.text(R.$('#val'), b, '11/10');
    R.flash(A, b, 2);
    R.sfx('gatetom', b, { vol: -6 });
    R.done(END);
  </script>
</body>
</html>
