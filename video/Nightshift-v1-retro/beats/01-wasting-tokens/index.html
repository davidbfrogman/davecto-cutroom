<!doctype html>
<!-- 01-wasting-tokens: "If you're paying for Claude or ChatGPT and you feel like you're wasting tokens": below the
     chest. Plan.Usage: the price counts up, Claude and ChatGPT chips land on their names, a few token cells fill
     ink, and on "wasting" the rest turn pink and blink under a "WASTED" stamp. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>01-wasting-tokens</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    .top { display: flex; justify-content: space-between; align-items: center; }
    .chips { display: flex; gap: calc(var(--u) * 1.2); }
    .chips .chip { font-size: calc(var(--u) * 4.2); }
    .price { font: calc(var(--u) * 5.6)/1 var(--f-pixel); }
    .tok { display: flex; gap: calc(var(--u) * .35); margin: calc(var(--u) * 1.8) 0 calc(var(--u) * 1.4); }
    .tok i { flex: 1; height: calc(var(--u) * 3.6); border: var(--hair) solid var(--ink); background: var(--paper); }
    .row { display: flex; justify-content: space-between; align-items: center; font: calc(var(--u) * 4.2)/1 var(--f-pixel); }
    #stamp { font-size: calc(var(--u) * 4.4); }
  </style>
</head>
<body data-world="pink">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = R.w("If you're paying", 0);
    const END = 3.14, W = p => R.w(p, R.START - 0.1);
    const N = 24, USED = 7;

    const A = R.win({ title: 'Plan.Usage', right: 'this month', variant: 'paper', x: 9, y: 106, w: 82, h: 'auto',
      body: `<div class="top"><div class="chips"><span class="chip h" id="c1">Claude</span><span class="chip h" id="c2">ChatGPT</span></div>
               <span class="price" id="price">$0/mo</span></div>
             <div class="tok">${'<i></i>'.repeat(N)}</div>
             <div class="row"><span>Tokens used</span><span id="pct">29%</span><span class="chip-inv h" id="stamp">✕ 71% WASTED</span></div>` });
    R.open(A, 0.3, { from: { x: 55, y: 90 } });

    R.count(R.$('#price'), 0.32, 0.5, 0, 200, v => `$${Math.round(v)}/mo`);
    R.show(R.$('#c1'), W('clotter')); R.sfx('pop', W('clotter'), { vol: -4 });
    R.show(R.$('#c2'), W('chat'));    R.sfx('pop', W('chat'), { vol: -4 });

    // the few tokens you actually used
    const cells = R.$$('.tok i');
    cells.slice(0, USED).forEach((c, i) => R.tl.set(c, { background: 'var(--ink)' }, R.T(W('and') + i * 0.067)));
    R.sfx('tick', W('and'), { vol: -6 });

    // "wasting": the rest go pink and blink
    const t = W('wasting');
    // blink by colour, not visibility (R.blink would hide the cells until it starts)
    for (let k = 0, tt = t; tt < END; k++, tt += 0.2)
      cells.slice(USED).forEach(c => R.tl.set(c, { background: k % 2 ? 'var(--paper)' : 'var(--accent)' }, R.T(tt)));
    R.hide(R.$('#pct'), t);
    R.show(R.$('#stamp'), t);
    R.flash(R.$('#stamp'), t, 1);
    R.sfx('shrink', t, { vol: -3 });
    R.done(END);
  </script>
</body>
</html>
