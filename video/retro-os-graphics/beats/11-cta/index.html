<!doctype html>
<!-- 40.97–49.07 "If you want a quick walkthrough on how you should be prompting today's smarter models,
     comment prompt below and I'll send it to you for free and follow along for more tips on AI."
     Inbox.app queues Walkthrough.pdf (waiting on your comment); a Comments window opens with a
     blinking cursor; PROMPT types in on "comment prompt", Post fires on "below", the comment
     lands; Inbox sends on "send it to you", stamps FREE on "free"; a Follow button flips to
     Following on "more tips". -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>11 Comment PROMPT</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    .px4 { font: calc(var(--u) * 4)/1 var(--f-pixel); }
    #IN .win__body { padding: calc(var(--u) * 1.4) calc(var(--u) * 1.8); display: flex; flex-direction: column; gap: calc(var(--u) * 1.3); }
    .file { display: flex; align-items: center; gap: calc(var(--u) * 1.4); white-space: nowrap; }
    .doc { flex: none; }
    .stat { display: flex; align-items: center; gap: calc(var(--u) * 1.4); white-space: nowrap; font: calc(var(--u) * 3.6)/1 var(--f-pixel); }
    .stat .seg { width: calc(var(--u) * 14); }
    .stat .seg i { height: calc(var(--u) * 2.2); }
    #free { margin-left: auto; font-size: calc(var(--u) * 4.4); }
    #CM .win__body { padding: calc(var(--u) * 1.4) calc(var(--u) * 1.8); display: flex; flex-direction: column; gap: calc(var(--u) * 1.4); }
    .list { min-height: calc(var(--u) * 4.4); display: flex; align-items: center; gap: calc(var(--u) * 1.4); }
    .cmt { visibility: hidden; display: flex; gap: calc(var(--u) * 1.4); align-items: center; }
    .ph { color: var(--grey); }
    .field { display: flex; align-items: center; gap: calc(var(--u) * 1.6); }
    .inp { flex: 1; height: calc(var(--u) * 6.6); border: var(--hair) solid var(--ink); background: var(--paper); display: flex; align-items: center; padding: 0 calc(var(--u) * 1.4); font: calc(var(--u) * 4.6)/1 var(--f-pixel); position: relative; }
    .inp > * { position: absolute; left: calc(var(--u) * 1.4); }
    #typed { left: calc(var(--u) * 1.4); }
    #cur { position: static; }
    .post { flex: none; font: calc(var(--u) * 4.2)/1 var(--f-pixel); background: var(--ink); color: var(--pink); padding: calc(var(--u) * 1.1) calc(var(--u) * 1.8) calc(var(--u) * 1.4); }
    #fol { font-size: calc(var(--u) * 5.4); padding: calc(var(--u) * .7) calc(var(--u) * 2) calc(var(--u) * 1.1); border: var(--hair) solid var(--ink); }
    #tips { font-size: calc(var(--u) * 4.2); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="9"></div>
  </div>
  <script>
    R.START = 40.97;
    R.sfxAuto = false;   // sounds are listed by hand at the end (the approved mix)
    const doc = R.pix(['kkkkk.', 'kpppkk', 'kppppk', 'kpkkpk', 'kppppk', 'kpkkpk', 'kppppk', 'kkkkkk'], 0.75);
    const IN = R.win({ title: 'Inbox.app', right: '0 New', variant: 'paper', layer: 'inbox', x: 34, y: 76, w: 50, h: 21,
      body: `<div class="file px4"><span class="doc">${doc}</span><span>Walkthrough.pdf</span><span class="chip-inv h" id="free">Free</span></div>
             <div class="stat"><span id="st">Waiting On Comment</span><span id="sc">█</span>${R.seg(4)}</div>` });
    IN.id = 'IN';
    const CM = R.win({ title: 'Comments', right: '(0)', variant: '', layer: 'comments', x: 5, y: 95, w: 72, h: 30,
      body: `<div class="list px4"><span class="micro ph" id="none">No Comments Yet</span><span class="cmt" id="c1"><span class="chip-inv">you</span><span>PROMPT</span></span></div>
             <div class="field"><div class="inp"><span class="ph" id="ph">Add a comment…</span><span id="tw"><span class="type" id="typed">PROMPT</span><span id="cur">█</span></span></div><span class="post" id="post">Post ▶▶▶</span></div>` });
    CM.id = 'CM';

    // "quick walkthrough": the file is queued.
    R.open(IN, 41.42, { from: { x: 60, y: 60 } });
    R.blink(R.$('#sc'), 41.6, 46.5, 0.6);
    // "prompting today's smarter models": the comment box opens, cursor blinking.
    R.open(CM, 42.92, { from: { x: 40, y: 110 } });
    R.tl.set('#CM', { zIndex: 3 }, 0);
    R.blink(R.$('#cur'), 43.1, 45.02, 0.5);
    // "comment prompt below".
    R.hide(R.$('#ph'), 45.02);
    R.type(R.$('#typed'), 45.02, 20);
    R.flash(R.$('#post'), 45.72, 2);
    R.hide(R.$('#tw'), 45.86);
    R.show(R.$('#ph'), 45.86);
    R.hide(R.$('#none'), 45.86);
    R.show(R.$('#c1'), 45.86);
    R.text(CM.querySelector('.win__bar .r'), 45.86, '(1)');
    // "I'll send it to you for free".
    R.tl.set('#IN', { zIndex: 4 }, R.T(46.4));
    R.flash(IN, 46.4, 1);
    R.text(IN.querySelector('.win__bar .r'), 46.4, '1 New');
    R.text(R.$('#st'), 46.52, 'Sending');
    R.hide(R.$('#sc'), 46.52);
    IN.querySelectorAll('.seg i').forEach((c, i) => R.tl.set(c, { backgroundColor: '#1E1E1E' }, R.T([46.6, 46.72, 46.9, 47.0][i])));
    R.text(R.$('#st'), 47.06, 'Sent ✓');
    R.show(R.$('#free'), 47.12);
    R.tl.set('#free', { backgroundColor: '#03AA5C', color: '#FEFEFE' }, R.T(47.12));
    // "follow along for more tips on AI".
    const F = R.box('chip-inv h', { id: 'fol', layer: 'follow', x: 5, y: 128.5, html: 'Follow ▶▶▶' });
    const T = R.box('chip h', { id: 'tips', layer: 'follow', x: 40, y: 130, html: '✣ More Tips On AI' });
    R.show(F, 47.68);
    R.show(T, 48.28);
    R.flash(F, 48.28, 2);
    R.text(F, 48.42, 'Following ✓');
    R.tl.set(F, { backgroundColor: '#F386A1', color: '#1E1E1E' }, R.T(48.42));
    // Sound.
    R.sfx('open', 41.32, { layer: 'inbox' }); R.sfx('open', 42.82, { layer: 'comments' }); for (let i = 0; i < 6; i++) R.sfx('type', 45.02 + i / 20, { layer: 'comments' });
    R.sfx('thunk', 45.72, { layer: 'comments' }); R.sfx('pop', 45.86, { layer: 'comments' }); R.sfx('notify', 46.4, { layer: 'inbox' });
    [46.6, 46.72, 46.9, 47.0].forEach(t => R.sfx('tick', t, { layer: 'inbox' })); R.sfx('success', 47.12, { layer: 'inbox' });
    R.sfx('pop', 47.68, { layer: 'follow' }); R.sfx('success', 48.42, { layer: 'follow' });
    R.done(49.07);
  </script>
</body>
</html>
