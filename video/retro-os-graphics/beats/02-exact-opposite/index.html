<!doctype html>
<!-- 4.62–8.20 "but according to Anthropic, that's the exact opposite of what you want to be doing."
     A source check loads in uneven jumps and lands on "Anthropic"; a System alert slams in on
     "exact", flashes, highlights "Opposite" and strikes through "Long Prompt = Better Results". -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>02 Exact opposite</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    .load { font: calc(var(--u) * 4)/1 var(--f-pixel); }
    .pbar { margin-top: calc(var(--u) * 1.6); height: calc(var(--u) * 3); border: var(--hair) solid var(--ink); position: relative; }
    .pbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ink); }
    .alert .win__body { display: flex; gap: calc(var(--u) * 3); padding: calc(var(--u) * 2.4); }
    .badge { flex: none; width: calc(var(--u) * 12); height: calc(var(--u) * 12); background: var(--ink); color: var(--pink);
             font: calc(var(--u) * 13)/1 var(--f-pixel); display: grid; place-items: center; padding-bottom: calc(var(--u) * 1); }
    .msg { flex: 1; display: flex; flex-direction: column; }
    .hd { font-size: calc(var(--u) * 9.4); color: var(--ink-86); margin: calc(var(--u) * 2.2) 0 calc(var(--u) * 2.6); }
    .hl { position: relative; display: inline-block; }
    .hl::before { content: ""; position: absolute; left: -2%; right: -2%; top: 4%; bottom: -10%; background: var(--pink); z-index: -1; clip-path: var(--wipe, inset(0 100% 0 0)); }
    .hl { z-index: 0; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .eq { position: relative; font: calc(var(--u) * 3.8)/1 var(--f-pixel); }
    .eq s { text-decoration: none; position: relative; }
    .eq s::after { content: ""; position: absolute; left: -2%; right: -2%; top: 50%; height: var(--hair); background: var(--ink); transform-origin: 0 50%; transform: scaleX(var(--k, 0)); }
    .btn { font: calc(var(--u) * 4)/1 var(--f-pixel); border: var(--hair) solid var(--ink); padding: calc(var(--u) * .6) calc(var(--u) * 2.2) calc(var(--u) * .9); background: var(--paper);
           outline: calc(var(--u) * .5) solid var(--ink); outline-offset: calc(var(--u) * .45); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="4"></div>
  </div>
  <script>
    R.START = 4.62;
    R.sfxAuto = false;   // sounds are listed by hand at the end (the approved mix)
    const L = R.win({ title: 'Source.Check', right: '0%', x: 8, y: 92, w: 52, h: 19,
      body: `<div class="load" id="lt">Checking: Anthropic Docs</div><div class="pbar"><i id="pf"></i></div>` });
    R.open(L, 4.84, { from: { x: 30, y: 120 } });
    const pct = L.querySelector('.win__bar .r');
    [[5.0, 18], [5.2, 31], [5.33, 64], [5.6, 71], [5.84, 100]].forEach(([t, p]) => {
      R.tl.set('#pf', { width: `${p}%` }, R.T(t));
      R.text(pct, t, `${p}%`);
    });
    R.text(R.$('#lt'), 5.84, 'Source: Anthropic ✓');

    const A = R.win({ title: 'System Message', right: '!', x: 6, y: 99, w: 76, h: 39, variant: 'paper',
      body: `<div class="badge">!</div>
             <div class="msg">
               <div class="micro rule">Anthropic.Guide · Prompting</div>
               <div class="disp hd">Exact <span class="hl" id="hl">Opposite.</span></div>
               <div class="row"><span class="eq">Long Prompt = <s id="st">Better Results</s></span><span class="btn" id="ok">OK</span></div>
             </div>` });
    A.classList.add('alert');
    R.open(A, 6.6, { from: { x: 34, y: 101 } });
    R.flash(A, 6.6, 2);
    R.hide(L, 6.6);
    R.tl.fromTo('#hl', { '--wipe': 'inset(0 100% 0 0)' }, { '--wipe': 'inset(0 0% 0 0)', duration: 0.27, ease: 'steps(4)' }, R.T(6.86));
    R.tl.fromTo('#st', { '--k': 0 }, { '--k': 1, duration: 0.33, ease: 'steps(5)' }, R.T(7.46));
    // Default-button ring blinks like a waiting dialog.
    for (let t = 7.6; t < 8.2; t += 0.4) { R.tl.set('#ok', { outlineColor: 'rgba(0,0,0,0)' }, R.T(t)); R.tl.set('#ok', { outlineColor: '#1E1E1E' }, R.T(t + 0.2)); }
    // Sound.
    R.sfx('open', 4.75); [5.0, 5.2, 5.33, 5.6].forEach(t => R.sfx('tick', t)); R.sfx('success', 5.84);
    R.sfx('alert', 6.6); R.sfx('strike', 6.86); R.sfx('strike', 7.46);
    R.done(8.2);
  </script>
</body>
</html>
