<!doctype html>
<!-- 06 16.25–21.27 "And I think there's three things that you can steal from their process to make
     building your app suck a whole lot less."
     Above the head (lavender). Claw.exe: an arcade claw machine stocked with Anthropic's process. Three
     prizes #1 #2 #3 light up on "three things" (ticks) while the claw sways on its rail. On "you can"
     it lines up over #1, drops on "steal" and grabs on "from" (thunk), hauls it up and over on "their
     process" and drops it down the YOURS chute on "to" (success). Suck-o-meter (own layer) opens on
     "make building your app" pinned at 97%, flashes on "suck" (alert) and drains to 12% on "a whole
     lot less" (falling blips, pop). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>06-claw</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    #CL .win__body { background: var(--paper); }
    .rail { position: absolute; left: calc(var(--u) * 1); right: calc(var(--u) * 1); top: calc(var(--u) * 1); height: calc(var(--u) * 1); background: var(--ink); }
    .sign { position: absolute; left: calc(var(--u) * 1.4); top: calc(var(--u) * 3.2); font: calc(var(--u) * 3)/1.1 var(--f-pixel); }
    #cl { position: absolute; top: calc(var(--u) * 1.6); display: flex; flex-direction: column; align-items: center; transform: translateX(-50%); }
    #ca { width: var(--hair); background: var(--ink); }
    .pz { position: absolute; bottom: calc(var(--u) * 1); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * .4); transform: translateX(-50%); visibility: hidden; }
    .pz span { font: calc(var(--u) * 2.8)/1 var(--f-pixel); background: var(--paper); border: var(--hair) solid var(--ink); padding: 0 calc(var(--u) * .4) calc(var(--u) * .15); }
    .ch { position: absolute; right: calc(var(--u) * 1.4); bottom: 0; width: calc(var(--u) * 14); height: calc(var(--u) * 9); border: var(--hair) solid var(--ink); border-bottom: 0; background: var(--win-2);
          display: flex; align-items: flex-end; justify-content: center; padding-bottom: calc(var(--u) * 1.2); font: calc(var(--u) * 3)/1 var(--f-pixel); }
    #got { position: absolute; right: calc(var(--u) * 2); bottom: calc(var(--u) * 10.4); visibility: hidden; }
    #SU .win__body { background: var(--paper); display: flex; align-items: center; gap: calc(var(--u) * 1.4); padding: calc(var(--u) * .8) calc(var(--u) * 1.4); font: calc(var(--u) * 3.6)/1 var(--f-pixel); }
    #SU .seg { flex: 1; }
    #SU .seg i { height: calc(var(--u) * 3.4); background: var(--accent); }
    #rd { min-width: calc(var(--u) * 9); text-align: right; font-size: calc(var(--u) * 5); }
  </style>
</head>
<body data-world="lavender">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = 16.25;
    const END = 21.27, W = p => R.w(p, R.START - 0.1);
    const open = R.pix(['...kkk...', '..kkkkk..', '.k.....k.', 'k.......k', 'k.......k'], .9);
    const shut = R.pix(['...kkk...', '..kkkkk..', '..k...k..', '...k.k...', '...k.k...'], .9);
    const prize = R.pix(['..kkk..', '.knnnk.', 'knnnnnk', 'knnpnnk', 'knnnnnk', '.knnnk.', '..kkk..'], .95);
    const PX = [16, 30, 44];                              // prize centres (u, inside the body)
    const CL = R.win({ title: 'Claw.exe', right: 'credits: 1', x: 4, y: 20.5, w: 82, h: 30,
      body: `<i class="rail"></i><span class="sign">PRIZES:<br>their process</span>
        ${PX.map((x, i) => `<div class="pz" id="z${i}" style="left:calc(var(--u) * ${x})">${prize}<span>#${i + 1}</span></div>`).join('')}
        <div class="ch">YOURS ▼</div><span class="chip chip--green" id="got">stolen ✓</span>
        <div id="cl"><i id="ca"></i><div id="co">${open}</div><div id="cs" style="display:none">${shut}</div></div>` });
    CL.id = 'CL';
    R.open(CL, Math.max(W('and i think'), R.START + 4 * R.F)); // room for the zoom trail inside the beat

    const th = W('three'), yc = W('you can'), st = W('steal'), fr = W('from'), pr = W('process'), to = W('to make');
    PX.forEach((_, i) => { const t = th + i * 2 * R.F; R.show(R.$('#z' + i), t); R.sfx('tick', t); });

    // claw: sway, line up, drop, grab, lift, carry, drop it in the chute
    const cl = R.$('#cl'), ca = R.$('#ca'), co = R.$('#co'), cs = R.$('#cs'), z0 = R.$('#z0');
    const CH = 70, TOP = 1.5, LOW = 9.6;
    const lerp = (a, b, k) => a + (b - a) * Math.max(0, Math.min(1, k));
    R.every(R.START, END, t => {
      const f = Math.round((t - R.START) * 15);
      let x, h = TOP, closed = false, carry = false;
      if (t < yc) x = 40 + [0, 2, 4, 6, 4, 2, 0, -2, -4, -6, -4, -2][f % 12];
      else if (t < st) x = lerp(40, PX[0], (t - yc) / (st - yc));
      else if (t < fr) { x = PX[0]; h = lerp(TOP, LOW, (t - st) / (fr - st)); }
      else if (t < pr) { x = PX[0]; h = lerp(LOW, TOP, (t - fr) / (pr - fr)); closed = carry = true; }
      else if (t < to) { x = lerp(PX[0], CH, (t - pr) / (to - pr)); closed = carry = true; }
      else { x = CH; }
      cl.style.left = R.u(x.toFixed(1)); ca.style.height = R.u(h.toFixed(1));
      co.style.display = closed ? 'none' : 'block'; cs.style.display = closed ? 'block' : 'none';
      if (carry) { z0.style.left = R.u(x.toFixed(1)); z0.style.bottom = R.u((1 + LOW - h).toFixed(1)); }
      else if (t >= to) z0.style.visibility = 'hidden';
    });
    R.sfx('thunk', fr);
    R.sfx('sweep', pr, { vol: -6 });
    R.show(R.$('#got'), to); R.sfx('success', to);
    R.text(CL.querySelector('.win__bar .r'), to, 'credits: 0');

    // Suck-o-meter
    const SU = R.win({ title: 'Suck-o-meter', right: 'your app', layer: 'meter', x: 4, y: 52, w: 82, h: 11,
      body: `<span>SUCK</span>${R.seg(12)}<span id="rd">97%</span>` });
    SU.id = 'SU';
    const mb = W('make building'), su = W('suck'), aw = W('a whole'), ls = R.we('less');
    R.open(SU, mb);
    R.flash(R.$('#rd'), su, 2); R.sfx('alert', su, { layer: 'meter', vol: -4 });
    const cells = SU.querySelectorAll('.seg i');
    for (let k = 0; k < 10; k++) {
      const t = aw + (ls - aw) * k / 9;
      R.tl.set(cells[11 - k], { backgroundColor: 'transparent' }, R.T(t));
      if (k % 2 === 0) R.sfx('blip', t, { freq: 700 * 2 ** (-k / 12), vol: -6, layer: 'meter' });
    }
    R.count(R.$('#rd'), aw, ls - aw, 97, 12, v => `${Math.round(v)}%`);
    R.sfx('pop', ls + 0.05, { layer: 'meter' });
    R.done(END);
  </script>
</body>
</html>
