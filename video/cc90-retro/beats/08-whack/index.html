<!doctype html>
<!-- 08 30.47–41.70 "Two, make sure it didn't break anything else. Have it run through the same tests with
     the old inputs versus the new inputs. You'd be surprised how often AI will fix one thing while
     breaking three others."
     The face is high in this scene, so: Step 2 of 3 header above the head ("2 ·" on "two", "Don't
     break anything else." on "didn't break", pop); the rest below the chest (orange).
     Regression.test opens on "have it run": five test rows on "run through the same tests" (ticks),
     the BEFORE column fills on "old inputs" and AFTER on "new inputs" (ticks), then the ≟ column
     checks off ✓✓✓✓ and the fifth row breaks ✗ (error), 4/5 pass.
     Whack-a-Bug (own layer) opens on "you'd be surprised": a bug peeks up on "surprised" (tick), the
     mallet slams it on "fix" (strike), FIXED 1; then three bugs pop up on "breaking", "three",
     "others" (error each), BROKE 3. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>08-whack</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    #HD .win__body { background: var(--accent); display: flex; align-items: center; padding-bottom: calc(var(--u) * .6) !important; gap: calc(var(--u) * 2); padding: 0 calc(var(--u) * 2); }
    #HD .disp { font-size: calc(var(--u) * 5); line-height: 1; }
    #h2 { visibility: hidden; }
    #RG .win__body { background: var(--paper); padding: calc(var(--u) * .6) calc(var(--u) * 1.4); }
    .tb { display: grid; grid-template-columns: 1fr calc(var(--u) * 13) calc(var(--u) * 13) calc(var(--u) * 6); row-gap: calc(var(--u) * .25); align-items: center; }
    .tb > span { font: calc(var(--u) * 3.1)/1.1 var(--f-pixel); padding: calc(var(--u) * .1) calc(var(--u) * .6) calc(var(--u) * .2); }
    .tb > span.m { font: 700 calc(var(--u) * 2.4)/1.4 var(--f-mono); }
    .tb > span.c { text-align: center; }
    .tb > .th { border-bottom: var(--hair) solid var(--ink); }
    .r { visibility: hidden; }
    .v { visibility: hidden; }
    #WB .win__body { background: var(--win-2); display: flex; flex-direction: column; padding: calc(var(--u) * .8) calc(var(--u) * 1.4); }
    .sc { display: flex; justify-content: space-between; font: calc(var(--u) * 3.4)/1 var(--f-pixel); }
    .holes { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; }
    .hole { position: relative; display: flex; align-items: flex-end; justify-content: center; }
    .hole > b { display: block; width: calc(var(--u) * 13); height: calc(var(--u) * 1.8); background: var(--ink); }
    .bug, .spl, .ham { position: absolute; left: 50%; transform: translateX(-50%); visibility: hidden; }
    .bug, .spl { bottom: calc(var(--u) * 1.6); }
    .ham { bottom: calc(var(--u) * 4.2); margin-left: calc(var(--u) * 3); }
  </style>
</head>
<body data-world="orange">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = 30.47;
    const END = 41.70, W = p => R.w(p, R.START - 0.1);

    // Step 2 of 3, above the head
    const HD = R.win({ title: 'Step 2 of 3', right: '✣ steal this', layer: 'head', x: 4, y: 20.5, w: 82, h: 12.5,
      body: `<span class="disp">2 ·</span><span class="disp" id="h2">Don't break anything else.</span>` });
    HD.id = 'HD';
    R.open(HD, Math.max(W('two'), R.START + 4 * R.F));        // room for the zoom trail inside the beat
    R.show(R.$('#h2'), W("didn't break")); R.sfx('pop', W("didn't break"), { layer: 'head' });
    R.close(HD, W('will'), { sfx: false });       // he leans up into it on "breaking three others"

    // Regression.test, below the chest
    const ROWS = [['signup("a@b.co")', '201', '201', '✓'], ['login("")', '400', '400', '✓'], ['cart.add(3)', '3 items', '3 items', '✓'],
      ['total([9.99])', '$9.99', '$9.99', '✓'], ['search("café")', '1 hit', '0 hits', '✗']];
    const RG = R.win({ title: 'Regression.test', right: '<span id="ps">0/5</span>', layer: 'test', x: 4, y: 78.5, w: 82, h: 33,
      body: `<div class="tb"><span class="th">TEST</span><span class="th c" id="hb">BEFORE</span><span class="th c" id="ha">AFTER</span><span class="th c">≟</span>
        ${ROWS.map((r, i) => `<span class="m r r${i}">${r[0]}</span><span class="c v b${i}">${r[1]}</span><span class="c v a${i}">${r[2]}</span><span class="c v q${i}">${r[3]}</span>`).join('')}</div>` });
    RG.id = 'RG';
    const hv = W('have it run'), ru = W('through the same'), te = R.we('tests'), ol = W('old'), ne = W('new'), ni = R.we('inputs', ne);
    R.open(RG, hv);
    ROWS.forEach((_, i) => { const t = ru + (te - ru) * i / 4; R.show(R.$('.r' + i), t); R.sfx('tick', t, { vol: -5, layer: 'test' }); });
    const hb = R.$('#hb'), ha = R.$('#ha');
    R.tl.set(hb, { backgroundColor: 'var(--accent)' }, R.T(ol));
    ROWS.forEach((_, i) => { const t = ol + 0.1 + i * 2 * R.F; R.show(R.$('.b' + i), t); if (i % 2 === 0) R.sfx('tick', t, { vol: -6, layer: 'test' }); });
    R.tl.set(hb, { backgroundColor: 'transparent' }, R.T(ne));
    R.tl.set(ha, { backgroundColor: 'var(--accent)' }, R.T(ne));
    ROWS.forEach((_, i) => { const t = ne + 0.1 + i * 2 * R.F; R.show(R.$('.a' + i), t); if (i % 2 === 0) R.sfx('tick', t, { vol: -6, layer: 'test' }); });
    R.tl.set(ha, { backgroundColor: 'transparent' }, R.T(ni + 0.15));
    const ps = R.$('#ps');
    ROWS.forEach((r, i) => {
      const t = ni + 0.15 + i * 3 * R.F;
      R.show(R.$('.q' + i), t);
      if (i < 4) { R.text(ps, t, `${i + 1}/5`); R.sfx('tick', t, { layer: 'test' }); }
      else {
        R.tl.set(R.$$(`.r${i}, .b${i}, .a${i}, .q${i}`), { backgroundColor: 'var(--warm)', color: 'var(--paper)' }, R.T(t));
        R.text(ps, t, '4/5 pass · 1 broke'); R.sfx('error', t, { layer: 'test' });
      }
    });

    // Whack-a-Bug
    const bugA = R.pix(['k.....k', '.k...k.', '..kkk..', '.knnnk.', 'kknnnkk', '.knnnk.', 'kkkkkkk'], .8);
    const splat = R.pix(['n..k..n', '.n.k.n.', '..nkn..', 'kkknkkk', '..nkn..', '.n.k.n.', 'n..k..n'], .8);
    const ham = R.pix(['kkkkkkkk', 'knnnnnnk', 'knnnnnnk', 'kkkkkkkk', '...kk...', '...kk...', '...kk...', '...kk...'], .8);
    const WB = R.win({ title: 'Whack-a-Bug', right: 'AI · player 1', layer: 'whack', x: 4, y: 113, w: 82, h: 26.5,
      body: `<div class="sc"><span>FIXED <span id="fx">0</span></span><span>BROKE <span id="bk">0</span></span></div>
        <div class="holes">${[...Array(8)].map((_, i) => `<div class="hole" id="h${i}"><div class="bug">${bugA}</div><div class="spl">${splat}</div><div class="ham">${ham}</div><b></b></div>`).join('')}</div>` });
    WB.id = 'WB';
    const yd = W("you'd"), sp = W('surprised'), fx = W('fix'), br = W('breaking');
    R.open(WB, yd);
    const H = i => R.$('#h' + i), q = (i, c) => H(i).querySelector(c);
    // one bug peeks up, the mallet slams it
    R.show(q(2, '.bug'), sp); R.sfx('tick', sp, { layer: 'whack' });
    R.tl.set(q(2, '.ham'), { autoAlpha: 1, y: R.u(-3), rotation: -20 }, R.T(fx - 0.2));
    R.tl.set(q(2, '.ham'), { y: R.u(1.2), rotation: 0 }, R.T(fx));
    R.hide(q(2, '.bug'), fx); R.show(q(2, '.spl'), fx);
    R.hide(q(2, '.ham'), fx + 0.4); R.hide(q(2, '.spl'), fx + 0.6);
    R.text(R.$('#fx'), fx, '1'); R.flash(R.$('#fx'), fx, 1);
    R.sfx('strike', fx, { layer: 'whack' });
    // three more pop up
    [[5, br], [7, W('three', br)], [0, W('others')]].forEach(([h, t], k) => {
      R.show(q(h, '.bug'), t); R.text(R.$('#bk'), t, String(k + 1)); R.sfx('error', t, { layer: 'whack', vol: -3 });
    });
    R.flash(R.$('#bk'), W('others'), 2);
    // the bugs wiggle (something always running)
    const bugs = R.$$('.bug');
    R.every(sp, END, t => { const f = Math.round(t * 15); bugs.forEach((b, i) => { b.style.marginLeft = R.u(((f + i) % 4 < 2 ? -.4 : .4)); }); });
    R.done(END);
  </script>
</body>
</html>
