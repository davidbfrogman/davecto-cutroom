<!doctype html>
<!-- 04-buried: "Buried inside of those ads are discount codes ... you weren't who the advertiser was targeting":
     above the head. A creator's sponsored electronics ad (drawn, generic: @gadget.lab, headphones / TV / laptop)
     scrolls down on "buried inside" past the sale copy to the codes; crop marks lock onto NEWSUB2026 and
     BLACKFRIDAY15. Then a Targeting window opens over the ad: tech followers ✓, gadget buyers ✓, you ✕. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>04-buried</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    .shot .win__body { padding: 0; background: var(--paper); }
    .strip { position: absolute; left: 0; top: 0; width: 100%; padding: calc(var(--u) * 1.6) calc(var(--u) * 2); }
    .hd { display: flex; align-items: center; gap: calc(var(--u) * 1.6); }
    .av { width: calc(var(--u) * 6); height: calc(var(--u) * 6); background: var(--ink); color: var(--accent); display: grid; place-items: center; font: calc(var(--u) * 4.6)/1 var(--f-pixel); }
    .who b { display: block; font: 700 calc(var(--u) * 3.6)/1.1 var(--f-display); letter-spacing: -.02em; }
    .who span { font: calc(var(--u) * 2.4)/1.2 var(--f-mono); color: var(--grey); }
    .pan { position: relative; margin-top: calc(var(--u) * 1.6); height: calc(var(--u) * 21); background: var(--accent); border: var(--hair) solid var(--ink);
           display: flex; align-items: center; justify-content: space-around; padding: 0 calc(var(--u) * 2); }
    .pan .disp { font-size: calc(var(--u) * 7); }
    .pan .bf { position: absolute; left: calc(var(--u) * 1.4); top: calc(var(--u) * 1.4); }
    .cp { font: 500 calc(var(--u) * 3.3)/1.3 var(--f-display); letter-spacing: -.01em; margin-top: calc(var(--u) * 1.6); }
    .cds { margin-top: calc(var(--u) * 1.6); }
    .cl { position: relative; display: inline-block; background: var(--accent); font: calc(var(--u) * 3.1)/1.35 var(--f-mono); padding: 0 calc(var(--u) * .8); margin-bottom: calc(var(--u) * .4); }
    .cl.k { font-weight: 700; }
    .gap { height: calc(var(--u) * 1.8); }
    .tags { margin-top: calc(var(--u) * 1.6); font: calc(var(--u) * 2.6)/1.3 var(--f-mono); color: var(--grey); }
    .cl .crop { left: calc(var(--u) * -1); top: calc(var(--u) * -.8); right: calc(var(--u) * -1); bottom: calc(var(--u) * -.8); color: var(--ink); }
    .crop b { width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); border-width: 0; }
    .crop b:nth-child(1) { border-left-width: calc(var(--u) * .5); border-top-width: calc(var(--u) * .5); }
    .crop b:nth-child(2) { border-right-width: calc(var(--u) * .5); border-top-width: calc(var(--u) * .5); }
    .crop b:nth-child(3) { border-left-width: calc(var(--u) * .5); border-bottom-width: calc(var(--u) * .5); }
    .crop b:nth-child(4) { border-right-width: calc(var(--u) * .5); border-bottom-width: calc(var(--u) * .5); }
    .tag { position: absolute; font-size: calc(var(--u) * 3.8); }
    .tgt .win__body { padding: calc(var(--u) * 1.4) calc(var(--u) * 1.6); }
    .lab { font: calc(var(--u) * 2.6)/1 var(--f-mono); letter-spacing: .04em; margin-bottom: calc(var(--u) * 1.2); }
    .aud { display: flex; justify-content: space-between; align-items: center; font: calc(var(--u) * 4.2)/1 var(--f-pixel);
           padding: calc(var(--u) * .5) calc(var(--u) * .8) calc(var(--u) * .8); }
    .aud.you { background: var(--ink); color: var(--accent); }
  </style>
</head>
<body data-world="yellow">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = 11.77;
    const END = 18.13, W = p => R.w(p, R.START - 0.1);
    const PHONES = ['...kkkkkk...', '..k......k..', '.k........k.', 'k..........k', 'k..........k', 'kkk......kkk', 'kpk......kpk', 'kpk......kpk', 'kpk......kpk', 'kkk......kkk'];
    const TV = ['....k....k....', '.....k..k.....', '......kk......', 'kkkkkkkkkkkkkk', 'kppppppppppppk', 'kpwwwwwwwwwwpk', 'kpwwwwwwwwwwpk', 'kpwwwwwwwwwwpk', 'kppppppppppppk', 'kkkkkkkkkkkkkk', '....kk..kk....'];
    const LAPTOP = ['..kkkkkkkkkk..', '..kppppppppk..', '..kpwwwwwwpk..', '..kpwwwwwwpk..', '..kpwwwwwwpk..', '..kppppppppk..', '..kkkkkkkkkk..', '.kwwwwwwwwwwk.', 'kkkkkkkkkkkkkk'];
    const crop = id => `<div class="crop h" id="${id}"><b></b><b></b><b></b><b></b></div>`;

    const ad = `<div class="strip" id="strip" data-bleed>` +
      `<div class="hd"><span class="av">G</span><span class="who"><b>@gadget.lab</b><span>Sponsored · Paid partnership</span></span></div>` +
      `<div class="pan"><span class="chip-inv bf">BLACK FRIDAY</span>${R.pix(PHONES, .9)}${R.pix(TV, .9)}${R.pix(LAPTOP, .9)}</div>` +
      `<div class="cp">Black Friday is live: up to 40% off headphones, TVs, laptops and more. Plus a little something just for you:</div>` +
      `<div class="cds" id="cds"><div class="cl k">▸ NEW SUBSCRIBERS</div><br><div class="cl">CODE: NEWSUB2026${crop('m1')}</div><br><div class="cl">30% off your first order</div>` +
      `<div class="gap"></div><div class="cl k">▸ AUDIO WEEK</div><br><div class="cl">CODE: BLACKFRIDAY15${crop('m2')}</div><br><div class="cl">extra 15% off headphones</div></div>` +
      `<div class="tags">#BlackFriday #tech #deals</div></div>`;

    const A = R.win({ title: 'Ad.Library ▸ @gadget.lab', right: '● active', variant: 'paper', x: 9, y: 21, w: 82, h: 47, layer: 'ad',
      body: ad + `<span class="chip-inv tag h" id="found" style="right:${R.u(1.4)};top:${R.u(1.2)}">2 codes · up to 30% off</span>` });
    A.classList.add('shot');
    R.open(A, R.START, { from: { x: 51, y: 80 } });

    // "buried inside": scroll down past the sale copy to the codes (measured, so it lands right at any size)
    const strip = R.$('#strip'), vp = strip.parentNode, sa = W('ads'), sb = W('discount');
    const target = () => Math.max(0, Math.min(R.$('#cds').offsetTop - strip.offsetTop - R.$('#root').clientWidth * .015, strip.offsetHeight - vp.clientHeight));
    R.every(sa, sb, t => { strip.style.transform = `translateY(${-target() * R.clamp((t - sa) / (sb - sa))}px)`; });
    R.sfx('sweep', sa, { vol: -8, layer: 'ad' });
    R.show(R.$('#m1'), W('discount')); R.sfx('pop', W('discount'), { vol: -5, layer: 'ad' });
    R.show(R.$('#m2'), W('codes')); R.sfx('pop', W('codes'), { vol: -5, layer: 'ad' });
    R.show(R.$('#found'), W('might')); R.sfx('secret', W('codes') + 0.2, { vol: -7, layer: 'ad' });
    R.blink(R.$('#m1'), W('might') + 0.3, END, 0.5);

    // who the advertiser was targeting (not you)
    const T = R.win({ title: 'Targeting.cfg', right: 'this ad', variant: 'grey', x: 53, y: 36.5, w: 38, h: 'auto', layer: 'target',
      body: `<div class="lab">shown to:</div><div class="aud h" id="a1">tech followers<span>✓</span></div>` +
        `<div class="aud h" id="a2">gadget buyers<span>✓</span></div><div class="aud you h" id="a3">you<span>✕</span></div>` });
    T.classList.add('tgt');
    R.open(T, W('because'), { from: { x: 50, y: 66 } });
    R.stagger([R.$('#a1'), R.$('#a2')], W('you', W('because')), W('you', W('because')) + 0.3, { sfx: 'tick', vol: -5, layer: 'target' });
    R.show(R.$('#a3'), W("weren't")); R.sfx('error', W("weren't"), { vol: -6, layer: 'target' });
    R.flash(R.$('#a3'), W('targeting.'), 2);
    R.done(END);
  </script>
</body>
</html>
