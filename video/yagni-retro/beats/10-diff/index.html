<!doctype html>
<!-- 10 40.40–45.84 "Oftentimes there is a simpler 30-line version that'll do just as well with less dependencies."
     Diff.app (green) above the head, side by side. Left: solution_v1.js, a code minimap scrolling
     forever, 4,812 lines, 47 dependency boxes. On "simpler" simple.js opens on the right and its 30
     lines draw in on "30-line" (ticks). Both run their tests on "do just as well": 12/12 ✓ each
     (success on "well"). On "less dependencies" the right shows 2 boxes against 47 and the title
     bar reads −4,782 lines · −45 deps (pop). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>10-diff</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    #DF .win__body { background: var(--win-2); display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 1.2); padding: calc(var(--u) * 1.2); }
    .col { display: flex; flex-direction: column; gap: calc(var(--u) * .8); background: var(--paper); border: var(--hair) solid var(--ink); padding: calc(var(--u) * 1); min-height: 0; }
    .col > .rw:first-child { border-bottom: var(--hair) solid var(--ink); padding-bottom: calc(var(--u) * .6); }
    .rw { display: flex; justify-content: space-between; align-items: center; font: calc(var(--u) * 3.1)/1 var(--f-pixel); white-space: nowrap; }
    .map { position: relative; flex: 1; overflow: hidden; }
    .map i { display: block; height: calc(var(--u) * .45); margin-bottom: calc(var(--u) * .25); background: var(--ink); }
    .map i.a { background: var(--accent); }
    #mr i { visibility: hidden; }
    .dep { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .25); height: calc(var(--u) * 3.3); align-content: flex-start; }
    .dep b { width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); background: var(--ink); }
    #R .dep b { background: var(--accent); outline: var(--hair) solid var(--ink); outline-offset: calc(var(--u) * -.2); }
    .ts { visibility: hidden; }
    #R > * { visibility: hidden; }
  </style>
</head>
<body data-world="green">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = 40.40;
    const END = 45.84, W = p => R.w(p, R.START - 0.1);
    R.seed(4);
    const wid = () => 20 + Math.round(R.rnd() * 75);
    const LEFT = [...Array(60)].map(() => [wid(), R.rnd() < .15]);
    const RIGHT = [...Array(30)].map((_, i) => [i % 10 === 9 ? 8 : 18 + Math.round(R.rnd() * 55), i === 0 || i === 29]);
    const bars = A => A.map(([w, a]) => `<i class="${a ? 'a' : ''}" style="width:${w}%"></i>`).join('');
    const DF = R.win({ title: 'Diff.app', right: 'v1 ⇄ v2', x: 4, y: 20.5, w: 82, h: 31.5,
      body: `<div class="col" id="L"><div class="rw"><span>solution_v1.js</span><span>AI</span></div>
          <div class="map" id="ml"><div id="sc">${bars(LEFT)}${bars(LEFT)}</div></div>
          <div class="rw"><span><span id="nl">4,812</span> lines</span><span class="chip chip--green ts" id="t0">12/12 ✓</span></div>
          <div class="dep">${'<b></b>'.repeat(47)}</div></div>
        <div class="col" id="R"><div class="rw"><span>simple.js</span><span>you</span></div>
          <div class="map" id="mr">${bars(RIGHT)}</div>
          <div class="rw"><span><span id="nr">0</span> lines</span><span class="chip chip--green ts" id="t1">12/12 ✓</span></div>
          <div class="dep" id="dr">${'<b></b>'.repeat(2)}</div></div>` });
    DF.id = 'DF';
    R.open(DF, W('oftentimes'), { from: { x: 46, y: 62 } });

    // the AI version never stops scrolling
    const sc = R.$('#sc');
    R.every(W('oftentimes'), END, t => { const k = Math.round((t - R.START) * 15) % 60; sc.style.transform = `translateY(calc(var(--u) * ${-0.7 * k}))`; });

    // simple.js
    const si = W('simpler'), a = W('30'), b = R.we('line');
    R.$$('#R > *').forEach(el => R.show(el, si));
    R.$$('#R .dep').forEach(el => R.hide(el, si));
    R.sfx('pop', si);
    const rl = R.$$('#mr i');
    rl.forEach((el, i) => R.show(el, a + (b - a) * i / 29));
    R.count(R.$('#nr'), a, b - a, 0, 30);
    for (let i = 0; i < 6; i++) R.sfx('tick', a + (b - a) * i / 5, { vol: -5 });

    // both pass
    R.show(R.$('#t0'), W('do')); R.sfx('tick', W('do'));
    R.show(R.$('#t1'), W('just')); R.sfx('tick', W('just'));
    R.flash(R.$('#t1'), W('well'), 1); R.sfx('success', W('well'));

    // dependencies
    const le = W('less'), de = W('dependencies');
    R.show(R.$('#dr'), le); R.sfx('pop', le);
    R.text(DF.querySelector('.win__bar .r'), de, '−4,782 lines · −45 deps');
    R.flash(DF.querySelector('.win__bar'), de, 2);
    R.done(END);
  </script>
</body>
</html>
