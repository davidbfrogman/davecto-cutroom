<!doctype html>
<!-- 04 11.87–14.66 "First one is YAGNI. You aren't going to need it."
     Principle 1 / 3 (yellow) above the head: a split-flap board. Five flaps spin through letters
     from "first one" and lock one by one into Y A G N I on "YAGNI" (ticks, lock). Then each word
     lights its letter as it's said: You / Aren't / Gonna / Need / It, and a footnote lands on "it". -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>04-yagni</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    #YG .win__body { background: var(--paper); display: flex; flex-direction: column; gap: calc(var(--u) * 1.2); padding: calc(var(--u) * 1.8); }
    .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: calc(var(--u) * 1.2); }
    .fl { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1); }
    .tile { position: relative; width: 100%; height: calc(var(--u) * 19); background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center;
            font-family: var(--f-display); font-weight: 600; letter-spacing: -.04em; font-size: calc(var(--u) * 15); line-height: 1; border: var(--hair) solid var(--ink); }
    .tile::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: calc(var(--u) * .35) solid var(--win-2); }
    .tile::before { content: ''; position: absolute; left: calc(var(--u) * -.6); right: calc(var(--u) * -.6); top: calc(50% - var(--u) * .9); height: calc(var(--u) * 1.8);
            border-left: calc(var(--u) * .6) solid var(--ink); border-right: calc(var(--u) * .6) solid var(--ink); }
    .fl span { font: calc(var(--u) * 3.6)/1 var(--f-pixel); visibility: hidden; white-space: nowrap; }
    .fn { display: flex; justify-content: space-between; align-items: center; font: calc(var(--u) * 2.6)/1 var(--f-mono); }
    #fn { visibility: hidden; }
  </style>
</head>
<body data-world="yellow">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = 11.87;
    const END = 14.66, W = p => R.w(p, R.START - 0.1);
    const L = 'YAGNI', WD = ['You', "Aren't", 'Gonna', 'Need', 'It'];
    const YG = R.win({ title: 'Principle 1 / 3', right: '▮▯▯', x: 4, y: 24, w: 82, h: 37,
      body: `<div class="board">${[...L].map((c, i) => `<div class="fl"><div class="tile" id="t${i}">·</div><span id="w${i}">${WD[i]}</span></div>`).join('')}</div>
        <div class="fn"><span class="micro">Departures · principles</span><span id="fn">¹ 97.3% of the time</span></div>` });
    YG.id = 'YG';
    const fo = W('first');
    R.open(YG, fo, { from: { x: 54, y: 78 } });

    // split-flap: spin, then lock left to right on "YAGNI"
    const yg = W('yagni'), AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const lockAt = [...L].map((_, i) => yg + i * 2 * R.F);
    const tiles = [...L].map((_, i) => R.$('#t' + i));
    R.every(fo + 0.1, lockAt[4] + R.F, t => {
      const f = Math.round(t * 15);
      tiles.forEach((el, i) => { if (t < lockAt[i]) el.textContent = AZ[(f * 7 + i * 11) % AZ.length]; });
    });
    for (let t = fo + 0.1; t < yg; t += 2 * R.F) R.sfx('tick', t, { vol: -8 });
    tiles.forEach((el, i) => { R.text(el, lockAt[i], L[i]); });
    R.sfx('lock', lockAt[4]);

    // the words light their letters
    WD.forEach((w, i) => {
      const t = W(['you', "aren't", 'going', 'need', 'it'][i]);
      R.show(R.$('#w' + i), t);
      R.tl.set(tiles[i], { backgroundColor: 'var(--accent)', color: 'var(--ink)' }, R.T(t));
      R.sfx('tick', t);
    });
    const it = W('it');
    R.show(R.$('#fn'), it + 0.1);
    R.flash(R.$('.board'), it + 0.1, 1);
    R.sfx('success', it + 0.1);
    R.done(END);
  </script>
</body>
</html>
