<!doctype html>
<!-- 06 19.63–22.66 "Two, DRY. Don't repeat yourself."
     Principle 2 / 3 (sky) above the head. A giant DRY lands on "DRY"; the three words light beside
     it as they're said. Under it a terminal echoes "don't repeat yourself" one line per frame from
     "Don't", scrolling and counting x01..x18, until ^C cuts it off at the end (thunk). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>06-echo</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    #DR .win__body { background: var(--paper); display: flex; flex-direction: column; gap: calc(var(--u) * 1.4); padding: calc(var(--u) * 1.6); }
    .top { display: flex; align-items: center; gap: calc(var(--u) * 3); }
    #big { font-family: var(--f-display); font-weight: 600; letter-spacing: -.06em; font-size: calc(var(--u) * 13); line-height: .8; padding: calc(var(--u) * 1.4) calc(var(--u) * 2) calc(var(--u) * 1.4) calc(var(--u) * 1.4);
           background: var(--accent); border: var(--hair) solid var(--ink); visibility: hidden; }
    .ex { display: flex; flex-direction: column; gap: calc(var(--u) * 1); font: calc(var(--u) * 4.4)/1 var(--f-pixel); }
    .ex span { color: var(--win-2); }
    .ex span b { font-weight: normal; text-decoration: underline; text-decoration-thickness: calc(var(--u) * .4); text-underline-offset: calc(var(--u) * .5); }
    .term { flex: 1; background: var(--ink); color: var(--paper); font: calc(var(--u) * 3.4)/calc(var(--u) * 3.6) var(--f-pixel); padding: calc(var(--u) * .8) calc(var(--u) * 1.4);
            display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative; }
    .term div { display: flex; justify-content: space-between; white-space: pre; }
    .term div i { font-style: normal; color: var(--accent); }
    #cnt { position: absolute; right: calc(var(--u) * 1.4); top: calc(var(--u) * .8); background: var(--accent); color: var(--ink); padding: 0 calc(var(--u) * .6) calc(var(--u) * .2); visibility: hidden; }
  </style>
</head>
<body data-world="sky">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = 19.63;
    const END = 22.66, W = p => R.w(p, R.START - 0.1);
    const DR = R.win({ title: 'Principle 2 / 3', right: '▮▮▯', x: 4, y: 20.5, w: 82, h: 43,
      body: `<div class="top"><span id="big">DRY</span><div class="ex"><span id="x0"><b>D</b>on't</span><span id="x1"><b>R</b>epeat</span><span id="x2"><b>Y</b>ourself</span></div></div>
        <div class="term" id="tm"><span id="cnt">x00</span><div id="tl"></div></div>` });
    DR.id = 'DR';
    R.open(DR, W('two'), { from: { x: 50, y: 70 } });
    const tm = R.$('#tm');

    // DRY lands
    const dry = W('dry');
    R.show(R.$('#big'), dry); R.flash(R.$('#big'), dry, 1); R.sfx('pop', dry);
    ["don't", 'repeat', 'yourself'].forEach((w, i) => { R.tl.set(R.$('#x' + i), { color: 'var(--ink)' }, R.T(W(w))); });

    // the echo: one line per frame (on twos) until ^C
    const a = W("don't"), stop = END - 0.2;
    const prompt = '<div><span>&gt; echo "don\'t repeat yourself"</span></div>';
    R.every(dry, END, t => {
      const n = t < a ? 0 : Math.min(Math.floor((t - a) * 15) + 1, Math.floor((stop - a) * 15) + 1);
      let h = prompt;
      for (let k = Math.max(0, n - 6); k < n; k++) h += `<div><span>don't repeat yourself</span><i>${String(k + 1).padStart(2, '0')}</i></div>`;
      if (t >= stop) h += '<div><span>^C  ✓ said it once.</span></div>';
      else if (t < a) h += '<div><span>_</span></div>';
      tm.querySelectorAll('div').forEach(d => d.remove());
      tm.insertAdjacentHTML('beforeend', h);
      R.$('#cnt').textContent = 'x' + String(n).padStart(2, '0');
    });
    R.show(R.$('#cnt'), a);
    for (let t = a; t < stop; t += 3 * R.F) R.sfx('tick', t, { vol: -8 });
    R.sfx('thunk', stop);
    R.done(END);
  </script>
</body>
</html>
