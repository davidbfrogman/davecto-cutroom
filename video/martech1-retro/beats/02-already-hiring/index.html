<!doctype html>
<!-- 02-already-hiring: "And there's some companies that are already hiring for it.": two real job postings
     (Profound, Gradial) cascade open above the head with the job title blacked out. The payoff is in 07. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>02-already-hiring</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    .shot .win__body { padding: 0; }
    .sw { position: relative; }
    .sw img { display: block; width: 100%; }
    .red { position: absolute; background: var(--ink); color: var(--accent); font-family: var(--f-pixel); line-height: 1;
           display: flex; align-items: center; justify-content: center; white-space: pre; overflow: hidden; }
    #hire { position: absolute; right: calc(var(--u) * 1.2); top: calc(var(--u) * 1.2); }
  </style>
</head>
<body data-world="pink">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = R.w("And there's some", 0);
    const END = 7.13, W = p => R.w(p, R.START - 0.1);
    const GL = '▓▒░#%&@$?!*';
    // mostly CLASSIFIED, glitching for two frames in every eight
    const scramble = (el, a, b, n) => R.every(a, b, t => { const f = Math.floor(t * 15); R.seed(f + n); let s = ''; for (let i = 0; i < n; i++) s += GL[Math.floor(R.rnd() * GL.length)]; el.textContent = (f + n) % 8 < 2 ? s : 'CLASSIFIED'; });
    // a screenshot with redaction boxes at [x, y, w, h] fractions of the image
    const shot = (src, ratio, reds, fs) => `<div class="sw"><img src="${src}" style="aspect-ratio:${ratio}">` +
      reds.map(([x, y, w, h], i) => `<span class="red" style="left:${x * 100 - 0.6}%;top:${y * 100 - 1.5}%;width:${w * 100 + 1.2}%;height:${h * 100 + 3}%;font-size:${R.u(fs)}">CLASSIFIED</span>`).join('') + `</div>`;

    // Profound's posting (layer: profound)
    const A = R.win({ title: 'tryprofound.com/careers', right: 'NYC · $140–220K', variant: 'paper', x: 9, y: 21, w: 82, h: 'auto', layer: 'profound',
      body: shot('profound.png', '2200/286', [[0.0295, 0.3147, 0.3562, 0.4125]], 4.6) });
    A.classList.add('shot');
    R.open(A, W('companies'), { from: { x: 50, y: 60 } });
    scramble(A.querySelector('.red'), W('that'), END, 10);

    // Gradial's posting, cascaded over it (layer: gradial)
    const B = R.win({ title: 'greenhouse.io', right: 'Seattle', variant: 'paper', x: 51, y: 32, w: 40, h: 'auto', layer: 'gradial',
      body: shot('gradial.png', '1080/420', [[0.0445, 0.619, 0.5288, 0.1953]], 3.6) + `<span class="chip-inv h" id="hire">● HIRING NOW</span>` });
    B.classList.add('shot');
    R.open(B, W('already'), { from: { x: 30, y: 40 } });
    scramble(B.querySelector('.red'), W('hiring'), END, 10);
    R.show(R.$('#hire'), W('hiring')); R.sfx('pop', W('hiring'), { vol: -4, layer: 'gradial' });
    R.blink(R.$('#hire'), W('hiring') + 0.3, END, 0.5);
    R.done(END);
  </script>
</body>
</html>
