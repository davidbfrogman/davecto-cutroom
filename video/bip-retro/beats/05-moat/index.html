<!doctype html>
<!-- 05 17.53–27.37 "Now, what they can't copy is the 50 customer conversations that you've had or all the
     trust that you've built or all the people that are following you rooting for you to succeed."
     Above the head (teal). Clone.exe, job 2: "source code ✓ copied" and "UI + logo ✓ copied" tick in,
     then "CAN'T COPY:" on "can't copy" (pop). customer convos counts 0 → 50 on "50 customer
     conversations" and fails ✗ on "had" (error); trust fails on "built" (error); people following
     you fails on "following" (error) and the title bar reads copied 2 of 5 · 3 errors.
     Cheering section (own layer) opens on "rooting": a row of pixel people bounce with GO! signs,
     sparkle on "succeed". -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>05-moat</title>
  <link rel="stylesheet" href="retro.css" />
  <script src="gsap.min.js"></script>
  <script src="retro.js"></script>
  <style>
    #CX .win__body { background: var(--paper); display: flex; flex-direction: column; gap: calc(var(--u) * .5); padding: calc(var(--u) * .8) calc(var(--u) * 1.6); font: calc(var(--u) * 3.1)/1 var(--f-pixel); }
    .rw { display: grid; grid-template-columns: 1fr calc(var(--u) * 10) calc(var(--u) * 22); align-items: center; border-bottom: var(--hair) solid var(--ink); padding: calc(var(--u) * .1) 0 calc(var(--u) * .35); visibility: hidden; }
    .rw .n { text-align: right; padding-right: calc(var(--u) * 1.4); color: var(--grey); }
    .rw .s { text-align: center; }
    .rw .s.ok { background: var(--accent); }
    .rw .s.no { visibility: hidden; background: var(--warm); color: var(--paper); }
    #hd { visibility: hidden; align-self: flex-start; }
    .ft { margin-top: auto; display: flex; justify-content: space-between; color: var(--grey); font-size: calc(var(--u) * 2.9); }
    #CR .win__body { background: var(--win-2); display: flex; align-items: flex-end; justify-content: space-around; padding: 0 calc(var(--u) * 1) calc(var(--u) * .6); }
    .fan { position: relative; display: flex; flex-direction: column; align-items: center; }
    .fan .sg { font: calc(var(--u) * 2.6)/1 var(--f-pixel); background: var(--accent); border: var(--hair) solid var(--ink); padding: 0 calc(var(--u) * .4) calc(var(--u) * .2); margin-bottom: calc(var(--u) * .4); }
  </style>
</head>
<body data-world="teal">
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <div class="clip" id="stage" data-start="0" data-duration="5"></div>
  </div>
  <script>
    R.START = 17.53;                                      // the scene cut
    const END = 27.37, W = p => R.w(p, R.START - 0.1);
    const ROWS = [['source code', '412k', 'ok'], ['UI + logo', '38', 'ok'], ['customer convos', '0', 'no'], ['trust you built', '∞', 'no'], ['people following', '1,204', 'no']];
    const CX = R.win({ title: 'Clone.exe', right: 'job 2 of 2', x: 4, y: 20.5, w: 82, h: 35,
      body: `<span class="chip-inv" id="hd">CAN'T COPY:</span>
        ${ROWS.map(([a, n, s], i) => `<div class="rw" id="r${i}"><span>${a}</span><span class="n" id="n${i}">${n}</span>${s === 'ok' ? '<span class="s ok">✓ copied</span>' : `<span class="s no" id="x${i}">✗ can't copy</span>`}</div>`).join('')}
` });
    CX.id = 'CX';
    const op = Math.max(W('now'), R.START + 4 * R.F);
    R.open(CX, op);
    [0, 1].forEach(i => { const t = op + 0.15 + i * 3 * R.F; R.show(R.$('#r' + i), t); R.sfx('tick', t, { vol: -5 }); });
    R.show(R.$('#hd'), W("can't copy")); R.sfx('pop', W("can't copy"), { vol: -3 });

    // 50 customer conversations
    const fi = W('50'), cv = R.we('conversations'), hd = W('had');
    R.show(R.$('#r2'), fi); R.sfx('tick', fi);
    R.count(R.$('#n2'), fi, cv - fi, 0, 50);
    const fail = (i, t) => { R.show(R.$('#x' + i), t); R.flash(R.$('#r' + i), t, 1); R.sfx('error', t, { vol: -4 }); };
    fail(2, hd);
    // trust
    R.show(R.$('#r3'), W('trust')); R.sfx('tick', W('trust'));
    fail(3, W('built'));
    // people
    R.show(R.$('#r4'), W('people')); R.sfx('tick', W('people'));
    fail(4, W('following'));
    R.text(CX.querySelector('.win__bar .r'), W('following') + 0.1, 'copied 2 of 5 · 3 errors');

    // the cheering section
    const fanA = R.pix(['k...k', '.kkk.', '.knk.', 'kkkkk', '.kkk.', '.k.k.', 'k...k'], .7);
    const fanB = R.pix(['.....', '.kkk.', 'kknkk', '.kkk.', '.kkk.', '.k.k.', '.k.k.'], .7);
    const SIGNS = ['GO!', '', 'YOU', '', 'GOT', '', 'THIS', '', 'GO!'];
    const CR = R.win({ title: 'Cheering section', right: '<span id="cn">1,204</span> fans', layer: 'fans', x: 4, y: 57.5, w: 82, h: 14,
      body: SIGNS.map((s, i) => `<div class="fan" id="fn${i}">${s ? `<span class="sg">${s}</span>` : ''}<div class="a">${fanA}</div><div class="b" style="display:none">${fanB}</div></div>`).join('') });
    CR.id = 'CR';
    const ro = W('rooting'), sc = W('succeed');
    R.open(CR, ro);
    const fans = SIGNS.map((_, i) => R.$('#fn' + i));
    R.every(ro, END, t => {
      const f = Math.round(t * 15), fast = t >= sc;
      fans.forEach((el, i) => {
        const up = ((f >> (fast ? 0 : 1)) + i) % 2 === 0;
        el.style.marginBottom = R.u(up ? 1.2 : 0);
        el.querySelector('.a').style.display = up ? 'block' : 'none';
        el.querySelector('.b').style.display = up ? 'none' : 'block';
      });
    });
    R.count(R.$('#cn'), sc, 0.6, 1204, 1311);
    R.sfx('sparkle', sc, { layer: 'fans' });
    R.done(END);
  </script>
</body>
</html>
